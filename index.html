
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARAH HARTA AJAIB4D — Selamat Ramadan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Amiri:wght@400;700&display=swap');

        :root {
            --emerald: #065f46;
            --emerald-light: #10b981;
            --gold: #d97706;
            --gold-light: #fbbf24;
            --gold-pale: #fde68a;
            --cream: #fef9e7;
            --deep: #022c22;
            --teal: #0d4a36;
        }

        * { box-sizing: border-box; }
        body { margin: 0; overflow-x: hidden; font-family: 'Amiri', serif; background: #011a10; }

        /* ========== BACKGROUND NIGHT SKY ========== */
        .sky-bg {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse at 50% 0%, #0a2a18 0%, #011a10 40%, #000d08 100%);
        }

        /* Stars twinkling */
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .star-dot {
            position: fixed; border-radius: 50%;
            background: #fff; pointer-events: none; z-index: 1;
            animation: twinkle ease-in-out infinite;
        }

        /* ========== MOON ========== */
        .moon-container {
            position: fixed; top: 40px; right: 80px; z-index: 3;
        }
        @keyframes moon-glow {
            0%, 100% { filter: drop-shadow(0 0 18px rgba(253,230,138,0.6)) drop-shadow(0 0 40px rgba(217,119,6,0.3)); }
            50% { filter: drop-shadow(0 0 30px rgba(253,230,138,0.9)) drop-shadow(0 0 70px rgba(217,119,6,0.5)); }
        }
        .moon-svg { animation: moon-glow 4s ease-in-out infinite; }

        /* ========== MOSQUE SILHOUETTE ========== */
        .mosque-layer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            z-index: 2; pointer-events: none;
        }

        /* ========== LANTERNS ========== */
        @keyframes lantern-swing {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
        }
        .lantern {
            position: fixed; z-index: 4; pointer-events: none;
            transform-origin: top center;
            animation: lantern-swing ease-in-out infinite;
        }
        @keyframes lantern-glow {
            0%, 100% { filter: drop-shadow(0 0 12px rgba(251,191,36,0.7)); }
            50% { filter: drop-shadow(0 0 25px rgba(251,191,36,1)); }
        }
        .lantern svg { animation: lantern-glow 2s ease-in-out infinite; }

        /* ========== KETUPAT FLOATING ========== */
        @keyframes ketupat-float {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            5% { opacity: 0.85; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
        }
        .ketupat {
            position: fixed; pointer-events: none; z-index: 3;
            font-size: 22px;
            animation: ketupat-float linear infinite;
            filter: drop-shadow(0 2px 6px rgba(251,191,36,0.5));
        }

        /* ========== LIGHT RAYS ========== */
        @keyframes ray-pulse {
            0%, 100% { opacity: 0.03; }
            50% { opacity: 0.1; }
        }
        .light-ray {
            position: fixed; top: 0; pointer-events: none; z-index: 2;
            background: linear-gradient(180deg, rgba(253,230,138,0.2) 0%, transparent 70%);
            transform-origin: top center;
            animation: ray-pulse ease-in-out infinite;
        }

        /* ========== GROUND GLOW ========== */
        .ground-glow {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 200px; z-index: 2; pointer-events: none;
            background: radial-gradient(ellipse at 50% 100%, rgba(6,95,70,0.25) 0%, transparent 70%);
        }

        /* ========== UI LAYER ========== */
        .ui-content { position: relative; z-index: 10; }

        /* ========== RAMADAN GLASS BUTTONS ========== */
        .rbtn {
            position: relative; overflow: hidden; cursor: pointer;
            font-family: 'Amiri', serif; font-weight: 700;
            letter-spacing: 0.04em; transition: all 0.35s ease;
            display: inline-flex; align-items: center; justify-content: center;
        }
        /* Shimmer sweep */
        .rbtn::before {
            content: '';
            position: absolute; top: 0; left: -120%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: skewX(-20deg);
            transition: left 0.55s ease;
        }
        .rbtn:hover::before { left: 140%; }
        /* Bottom border accent line */
        .rbtn::after {
            content: '';
            position: absolute; bottom: 0; left: 10%; right: 10%; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(253,230,138,0.8), transparent);
            border-radius: 2px;
        }
        .rbtn:hover { transform: translateY(-3px) scale(1.04); }
        .rbtn:active { transform: scale(0.96) !important; }

        /* EMERALD GOLD — primary CTA */
        .rbtn-primary {
            background: linear-gradient(135deg, rgba(6,95,70,0.85) 0%, rgba(4,60,40,0.9) 100%);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(253,230,138,0.4);
            box-shadow: 0 0 20px rgba(16,185,129,0.2), inset 0 1px 0 rgba(253,230,138,0.2);
            color: #fde68a;
        }
        .rbtn-primary:hover {
            background: linear-gradient(135deg, rgba(16,185,129,0.45) 0%, rgba(6,95,70,0.9) 100%);
            border-color: rgba(253,230,138,0.8);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 40px rgba(16,185,129,0.4);
            color: #fff;
        }

        /* GOLD GLASS — secondary */
        .rbtn-gold {
            background: linear-gradient(135deg, rgba(217,119,6,0.3) 0%, rgba(120,60,0,0.2) 100%);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(251,191,36,0.45);
            box-shadow: 0 0 20px rgba(217,119,6,0.2), inset 0 1px 0 rgba(253,230,138,0.25);
            color: #fde68a;
        }
        .rbtn-gold:hover {
            background: linear-gradient(135deg, rgba(217,119,6,0.55) 0%, rgba(180,100,0,0.4) 100%);
            border-color: rgba(251,191,36,0.9);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 40px rgba(251,191,36,0.5);
            color: #fff;
        }

        /* TEAL GLASS — info */
        .rbtn-teal {
            background: linear-gradient(135deg, rgba(13,74,54,0.7) 0%, rgba(4,40,30,0.8) 100%);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(52,211,153,0.35);
            box-shadow: 0 0 15px rgba(52,211,153,0.15), inset 0 1px 0 rgba(52,211,153,0.2);
            color: #6ee7b7;
        }
        .rbtn-teal:hover {
            background: linear-gradient(135deg, rgba(16,185,129,0.4) 0%, rgba(6,95,70,0.6) 100%);
            border-color: rgba(52,211,153,0.75);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 30px rgba(52,211,153,0.4);
            color: #fff;
        }

        /* RED GLASS — danger */
        .rbtn-danger {
            background: linear-gradient(135deg, rgba(185,28,28,0.3) 0%, rgba(80,10,10,0.5) 100%);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(252,165,165,0.3);
            box-shadow: 0 0 15px rgba(239,68,68,0.15), inset 0 1px 0 rgba(252,165,165,0.15);
            color: #fca5a5;
        }
        .rbtn-danger:hover {
            background: linear-gradient(135deg, rgba(239,68,68,0.45) 0%, rgba(185,28,28,0.4) 100%);
            border-color: rgba(252,165,165,0.75);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 30px rgba(239,68,68,0.5);
            color: #fff;
        }

        /* BOX BUTTONS */
        .box-rbtn {
            position: relative; overflow: hidden; cursor: pointer;
            background: linear-gradient(135deg, rgba(6,95,70,0.35) 0%, rgba(4,40,25,0.5) 50%, rgba(217,119,6,0.15) 100%);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(253,230,138,0.3);
            box-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 0 15px rgba(16,185,129,0.08), inset 0 1px 0 rgba(253,230,138,0.12);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .box-rbtn::after {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 20%, rgba(253,230,138,0.1) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.3s;
        }
        .box-rbtn:hover {
            transform: translateY(-8px) scale(1.1);
            border-color: rgba(253,230,138,0.8);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 40px rgba(251,191,36,0.35), inset 0 1px 0 rgba(253,230,138,0.3);
        }
        .box-rbtn:hover::after { opacity: 1; }

        /* GLASS PANEL */
        .glass-panel {
            background: linear-gradient(135deg, rgba(6,95,70,0.18) 0%, rgba(0,0,0,0.55) 100%);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(253,230,138,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(253,230,138,0.1);
        }

        /* ========== MARQUEE ========== */
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; animation: marquee 40s linear infinite; }

        /* ========== ANIMATIONS ========== */
        @keyframes pulse-emerald {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(16,185,129,0.4); }
            50% { transform: scale(1.04); box-shadow: 0 0 40px rgba(16,185,129,0.7); }
        }
        .animate-pulse-emerald { animation: pulse-emerald 2.5s ease-in-out infinite; }

        @keyframes bounce-chat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-chat { animation: bounce-chat 2s ease-in-out infinite; }

        @keyframes glow-gold {
            0%, 100% { box-shadow: 0 0 20px rgba(251,191,36,0.4), 0 0 40px rgba(217,119,6,0.2); }
            50% { box-shadow: 0 0 35px rgba(251,191,36,0.7), 0 0 70px rgba(217,119,6,0.4); }
        }
        .animate-glow { animation: glow-gold 2.5s ease-in-out infinite; }

        /* ========== MUSIC BUTTON ========== */
        @keyframes music-pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(16,185,129,0.4); }
            50% { box-shadow: 0 0 25px rgba(16,185,129,0.8), 0 0 50px rgba(16,185,129,0.3); }
        }
        .rbtn-music {
            background: linear-gradient(135deg, rgba(6,95,70,0.6), rgba(4,40,25,0.7));
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(52,211,153,0.4);
            box-shadow: 0 0 12px rgba(16,185,129,0.25);
            color: #6ee7b7; font-weight: 800; overflow: hidden;
            transition: all 0.3s ease; cursor: pointer; position: relative;
        }
        .rbtn-music.playing { animation: music-pulse 1.5s ease-in-out infinite; }
        .rbtn-music:hover {
            background: linear-gradient(135deg, rgba(16,185,129,0.4), rgba(6,95,70,0.7));
            border-color: rgba(52,211,153,0.75); color: #fff;
            transform: scale(1.08);
        }

        /* ========== FLYING ELEMENTS ========== */
        @keyframes elem-fly {
            0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.5) rotate(45deg); }
        }
        .fly-elem { position: fixed; font-size: 20px; pointer-events: none; z-index: 100; animation: elem-fly 1.4s ease-out forwards; }

        /* ========== RIPPLE ========== */
        @keyframes ripple-expand { to { transform: scale(4); opacity: 0; } }
        .ripple {
            position: absolute; border-radius: 50%;
            background: rgba(253,230,138,0.3);
            transform: scale(0); animation: ripple-expand 0.6s linear;
            pointer-events: none;
        }

        /* Input style */
        .ramadan-input {
            background: rgba(6,95,70,0.15);
            border: 1px solid rgba(253,230,138,0.3);
            backdrop-filter: blur(10px);
            color: #fde68a;
            outline: none;
            transition: border-color 0.3s;
        }
        .ramadan-input:focus { border-color: rgba(253,230,138,0.7); }
        .ramadan-input::placeholder { color: rgba(253,230,138,0.35); }
    </style>
</head>
<body>

    <!-- Night Sky -->
    <div class="sky-bg"></div>

    <!-- Stars (dots, generated by JS) -->
    <div id="starfield"></div>

    <!-- Light rays from top -->
    <div class="light-ray" style="left:8%;width:90px;height:100vh;animation-duration:7s;"></div>
    <div class="light-ray" style="left:22%;width:55px;height:100vh;animation-duration:9s;animation-delay:1s;"></div>
    <div class="light-ray" style="left:42%;width:120px;height:100vh;animation-duration:6s;animation-delay:2s;"></div>
    <div class="light-ray" style="left:62%;width:70px;height:100vh;animation-duration:8s;animation-delay:0.5s;"></div>
    <div class="light-ray" style="left:78%;width:85px;height:100vh;animation-duration:7.5s;animation-delay:1.5s;"></div>

    <!-- Ground glow -->
    <div class="ground-glow"></div>

    <!-- MOON (crescent) -->
    <div class="moon-container">
        <svg class="moon-svg" width="100" height="100" viewBox="0 0 100 100">
            <defs>
                <radialGradient id="moonGrad" cx="40%" cy="40%">
                    <stop offset="0%" stop-color="#fef9c3"/>
                    <stop offset="60%" stop-color="#fde68a"/>
                    <stop offset="100%" stop-color="#d97706"/>
                </radialGradient>
            </defs>
            <!-- Full circle minus offset circle = crescent -->
            <circle cx="50" cy="50" r="38" fill="url(#moonGrad)"/>
            <circle cx="72" cy="40" r="32" fill="#011a10"/>
            <!-- Moon surface texture dots -->
            <circle cx="30" cy="45" r="3" fill="rgba(217,119,6,0.3)"/>
            <circle cx="42" cy="62" r="2" fill="rgba(217,119,6,0.2)"/>
            <circle cx="25" cy="60" r="4" fill="rgba(217,119,6,0.15)"/>
        </svg>
    </div>

    <!-- LANTERNS -->
    <div class="lantern" style="top:0;left:5%;animation-duration:4s;">
        <svg width="36" height="80" viewBox="0 0 36 80">
            <!-- String -->
            <line x1="18" y1="0" x2="18" y2="12" stroke="#d97706" stroke-width="2"/>
            <!-- Top cap -->
            <ellipse cx="18" cy="14" rx="10" ry="4" fill="#d97706"/>
            <!-- Body -->
            <ellipse cx="18" cy="42" rx="14" ry="28" fill="rgba(217,119,6,0.75)" stroke="#fbbf24" stroke-width="1.5"/>
            <!-- Glow inner -->
            <ellipse cx="18" cy="42" rx="8" ry="20" fill="rgba(253,230,138,0.5)"/>
            <!-- Ribs -->
            <line x1="8" y1="28" x2="8" y2="56" stroke="#fbbf24" stroke-width="1" opacity="0.6"/>
            <line x1="28" y1="28" x2="28" y2="56" stroke="#fbbf24" stroke-width="1" opacity="0.6"/>
            <!-- Bottom cap -->
            <ellipse cx="18" cy="70" rx="10" ry="4" fill="#d97706"/>
            <!-- Tassel -->
            <line x1="18" y1="74" x2="14" y2="80" stroke="#fbbf24" stroke-width="1.5"/>
            <line x1="18" y1="74" x2="18" y2="80" stroke="#fbbf24" stroke-width="1.5"/>
            <line x1="18" y1="74" x2="22" y2="80" stroke="#fbbf24" stroke-width="1.5"/>
        </svg>
    </div>
    <div class="lantern" style="top:0;right:5%;animation-duration:5s;animation-delay:0.8s;">
        <svg width="30" height="70" viewBox="0 0 30 70">
            <line x1="15" y1="0" x2="15" y2="10" stroke="#d97706" stroke-width="2"/>
            <ellipse cx="15" cy="12" rx="8" ry="3" fill="#d97706"/>
            <ellipse cx="15" cy="36" rx="11" ry="24" fill="rgba(185,28,28,0.7)" stroke="#f87171" stroke-width="1.5"/>
            <ellipse cx="15" cy="36" rx="6" ry="16" fill="rgba(253,200,138,0.4)"/>
            <ellipse cx="15" cy="60" rx="8" ry="3" fill="#d97706"/>
            <line x1="15" y1="63" x2="12" y2="70" stroke="#fbbf24" stroke-width="1.5"/>
            <line x1="15" y1="63" x2="18" y2="70" stroke="#fbbf24" stroke-width="1.5"/>
        </svg>
    </div>
    <div class="lantern" style="top:0;left:35%;animation-duration:6s;animation-delay:1.5s;">
        <svg width="24" height="58" viewBox="0 0 24 58">
            <line x1="12" y1="0" x2="12" y2="8" stroke="#d97706" stroke-width="1.5"/>
            <ellipse cx="12" cy="10" rx="7" ry="3" fill="#065f46"/>
            <ellipse cx="12" cy="30" rx="9" ry="20" fill="rgba(6,95,70,0.8)" stroke="#34d399" stroke-width="1.5"/>
            <ellipse cx="12" cy="30" rx="5" ry="13" fill="rgba(134,239,172,0.35)"/>
            <ellipse cx="12" cy="50" rx="7" ry="3" fill="#065f46"/>
            <line x1="12" y1="53" x2="9" y2="58" stroke="#34d399" stroke-width="1.5"/>
            <line x1="12" y1="53" x2="15" y2="58" stroke="#34d399" stroke-width="1.5"/>
        </svg>
    </div>
    <div class="lantern" style="top:0;right:30%;animation-duration:4.5s;animation-delay:2s;">
        <svg width="28" height="65" viewBox="0 0 28 65">
            <line x1="14" y1="0" x2="14" y2="10" stroke="#d97706" stroke-width="2"/>
            <ellipse cx="14" cy="12" rx="9" ry="3.5" fill="#d97706"/>
            <ellipse cx="14" cy="36" rx="12" ry="24" fill="rgba(120,60,0,0.7)" stroke="#fbbf24" stroke-width="1.5"/>
            <ellipse cx="14" cy="36" rx="7" ry="16" fill="rgba(253,230,138,0.35)"/>
            <ellipse cx="14" cy="60" rx="9" ry="3.5" fill="#d97706"/>
            <line x1="14" y1="63" x2="10" y2="65" stroke="#fbbf24" stroke-width="1.5"/>
            <line x1="14" y1="63" x2="18" y2="65" stroke="#fbbf24" stroke-width="1.5"/>
        </svg>
    </div>

    <!-- MOSQUE SILHOUETTE (SVG) -->
    <div class="mosque-layer">
        <svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice" style="width:100%;height:auto;display:block;">
            <defs>
                <linearGradient id="mosqueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#065f46" stop-opacity="0.9"/>
                    <stop offset="100%" stop-color="#011a10" stop-opacity="1"/>
                </linearGradient>
            </defs>
            <!-- Main prayer hall base -->
            <rect x="280" y="160" width="880" height="160" fill="url(#mosqueGrad)"/>
            <!-- Left minaret -->
            <rect x="300" y="80" width="40" height="200" fill="url(#mosqueGrad)"/>
            <!-- Left minaret balcony -->
            <rect x="292" y="120" width="56" height="12" rx="3" fill="url(#mosqueGrad)"/>
            <!-- Left minaret top dome -->
            <ellipse cx="320" cy="80" rx="22" ry="18" fill="url(#mosqueGrad)"/>
            <polygon points="320,50 328,72 312,72" fill="#fbbf24" opacity="0.9"/>

            <!-- Right minaret -->
            <rect x="1100" y="80" width="40" height="200" fill="url(#mosqueGrad)"/>
            <rect x="1092" y="120" width="56" height="12" rx="3" fill="url(#mosqueGrad)"/>
            <ellipse cx="1120" cy="80" rx="22" ry="18" fill="url(#mosqueGrad)"/>
            <polygon points="1120,50 1128,72 1112,72" fill="#fbbf24" opacity="0.9"/>

            <!-- Center main dome -->
            <ellipse cx="720" cy="130" rx="130" ry="100" fill="url(#mosqueGrad)"/>
            <!-- Mini dome left -->
            <ellipse cx="500" cy="165" rx="70" ry="55" fill="url(#mosqueGrad)"/>
            <!-- Mini dome right -->
            <ellipse cx="940" cy="165" rx="70" ry="55" fill="url(#mosqueGrad)"/>

            <!-- Arched windows (light glow) -->
            <ellipse cx="520" cy="220" rx="18" ry="25" fill="rgba(253,230,138,0.12)"/>
            <ellipse cx="620" cy="220" rx="18" ry="25" fill="rgba(253,230,138,0.12)"/>
            <ellipse cx="720" cy="220" rx="18" ry="25" fill="rgba(253,230,138,0.15)"/>
            <ellipse cx="820" cy="220" rx="18" ry="25" fill="rgba(253,230,138,0.12)"/>
            <ellipse cx="920" cy="220" rx="18" ry="25" fill="rgba(253,230,138,0.12)"/>

            <!-- Crescent on main dome -->
            <circle cx="720" cy="42" r="16" fill="#fbbf24"/>
            <circle cx="728" cy="37" r="13" fill="#022c22"/>
            <polygon points="720,22 724,36 716,36" fill="#fbbf24"/>

            <!-- Ground fill -->
            <rect x="0" y="260" width="1440" height="60" fill="#011a10"/>

            <!-- Trees / bushes sides -->
            <ellipse cx="200" cy="255" rx="55" ry="45" fill="#022c22"/>
            <ellipse cx="240" cy="260" rx="35" ry="40" fill="#033020"/>
            <ellipse cx="1240" cy="255" rx="55" ry="45" fill="#022c22"/>
            <ellipse cx="1200" cy="260" rx="35" ry="40" fill="#033020"/>
        </svg>
    </div>

    <!-- KETUPAT particles (z-index 3, generated by JS) -->
    <div id="ketupatLayer"></div>

    <!-- Running Text -->
    <div class="ui-content fixed top-0 left-0 right-0 overflow-hidden z-10"
         style="background:linear-gradient(90deg,rgba(6,95,70,0.7),rgba(4,60,40,0.6),rgba(6,95,70,0.7));backdrop-filter:blur(14px);border-bottom:1px solid rgba(253,230,138,0.25);padding:10px 0;">
        <div class="animate-marquee whitespace-nowrap">
            <span id="winnerText" class="text-sm font-bold" style="color:#fde68a;font-family:'Amiri',serif;"></span>
        </div>
    </div>

    <!-- Controls -->

    // ========== KETUPAT PARTICLES ==========
    // Ketupat SVG (diamond woven pattern)
    function ketupatSVG(color1, color2, size) {
        return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <polygon points="20,2 38,20 20,38 2,20" fill="${color1}" stroke="${color2}" stroke-width="1.5"/>
            <!-- Woven lines horizontal -->
            <line x1="8" y1="14" x2="32" y2="14" stroke="${color2}" stroke-width="1" opacity="0.7"/>
            <line x1="4" y1="20" x2="36" y2="20" stroke="${color2}" stroke-width="1" opacity="0.7"/>
            <line x1="8" y1="26" x2="32" y2="26" stroke="${color2}" stroke-width="1" opacity="0.7"/>
            <!-- Woven lines vertical -->
            <line x1="14" y1="8" x2="14" y2="32" stroke="${color2}" stroke-width="1" opacity="0.7"/>
            <line x1="20" y1="4" x2="20" y2="36" stroke="${color2}" stroke-width="1" opacity="0.7"/>
            <line x1="26" y1="8" x2="26" y2="32" stroke="${color2}" stroke-width="1" opacity="0.7"/>
            <!-- Center knot -->
            <circle cx="20" cy="20" r="3" fill="${color2}" opacity="0.8"/>
            <!-- Top/bottom small ropes -->
            <line x1="20" y1="0" x2="20" y2="3" stroke="${color2}" stroke-width="2"/>
            <line x1="20" y1="37" x2="20" y2="40" stroke="${color2}" stroke-width="2"/>
        </svg>`;
    }

    const ketupatColors = [
        ['rgba(6,95,70,0.8)', '#fbbf24'],
        ['rgba(217,119,6,0.7)', '#fde68a'],
        ['rgba(185,28,28,0.6)', '#fca5a5'],
        ['rgba(4,40,25,0.8)', '#34d399'],
        ['rgba(120,50,0,0.7)', '#fcd34d'],
    ];

    function spawnKetupat() {
        const layer = document.getElementById('ketupatLayer');
        const k = document.createElement('div');
        k.className = 'ketupat';
        const [c1, c2] = ketupatColors[Math.floor(Math.random() * ketupatColors.length)];
        const size = 20 + Math.random() * 22;
        k.innerHTML = ketupatSVG(c1, c2, size);
        k.style.left = (Math.random() * 100) + '%';
        k.style.bottom = '-60px';
        const dur = 10 + Math.random() * 14;
        k.style.animationDuration = dur + 's';
        k.style.animationDelay = (Math.random() * 4) + 's';
        layer.appendChild(k);
        setTimeout(() => k.remove(), (dur + 5) * 1000);
    }
    for (let i = 0; i < 18; i++) setTimeout(() => spawnKetupat(), Math.random() * 5000);
    setInterval(spawnKetupat, 1200);

    // ========== MAHJONG MUSIC ==========
    let audioCtx = null, musicPlaying = false, musicTimer = null;
    function getCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }
    const N = { G3:196, A3:220, C4:261.63, D4:293.66, E4:329.63, G4:392, A4:440, C5:523.25, D5:587.33, E5:659.25, G5:783.99, A5:880, C6:1046.5 };
    const MELODY = [
        {n:'G4',d:.25},{n:'A4',d:.25},{n:'C5',d:.5},{n:'A4',d:.25},{n:'G4',d:.25},{n:'E4',d:.5},
        {n:'G4',d:.25},{n:'A4',d:.25},{n:'C5',d:.25},{n:'D5',d:.25},{n:'E5',d:.5},{n:'D5',d:.25},{n:'C5',d:.25},
        {n:'A4',d:.5},{n:'G4',d:.5},{n:'C5',d:.25},{n:'D5',d:.25},{n:'E5',d:.5},
        {n:'G5',d:.25},{n:'E5',d:.25},{n:'D5',d:.25},{n:'C5',d:.25},{n:'A4',d:.25},{n:'G4',d:.25},{n:'A4',d:.5},
        {n:'C5',d:.75},{n:'A4',d:.25},{n:'G4',d:.25},{n:'A4',d:.25},{n:'C5',d:.25},{n:'E5',d:.25},
        {n:'D5',d:.25},{n:'C5',d:.25},{n:'A4',d:.5},{n:'G4',d:.25},{n:'C5',d:.25},{n:'E5',d:.25},{n:'G5',d:.25},
        {n:'A5',d:.5},{n:'G5',d:.25},{n:'E5',d:.25},{n:'D5',d:.25},{n:'C5',d:.25},{n:'A4',d:.25},{n:'G4',d:.25},{n:'C5',d:1},
    ];
    function pNote(f,t,dur,type,vol,ctx){ const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.setValueAtTime(vol,t+dur*.75); g.gain.linearRampToValueAtTime(0,t+dur); o.start(t); o.stop(t+dur+.05); }
    function pWoodblock(t,ctx){ const buf=ctx.createBuffer(1,ctx.sampleRate*.07,ctx.sampleRate),d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*.012)); const src=ctx.createBufferSource(),bpf=ctx.createBiquadFilter(),g=ctx.createGain(); bpf.type='bandpass'; bpf.frequency.value=900; bpf.Q.value=3; src.buffer=buf; src.connect(bpf); bpf.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(.1,t); src.start(t); src.stop(t+.08); }
    function pBell(f,t,ctx){ [1,2.756].forEach(r=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.type='sine'; o.frequency.value=f*r; g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.001,t+1.8); o.start(t); o.stop(t+1.9); }); }
    function scheduleLoop(){
        if(!musicPlaying)return;
        const ctx=getCtx(), bpm=132, beat=60/bpm, start=ctx.currentTime+.05;
        let t=start;
        MELODY.forEach(note=>{ pNote(N[note.n],t,note.d*beat*.88,'triangle',.11,ctx); t+=note.d*beat; });
        let ht=start; MELODY.forEach(note=>{ pNote(N[note.n]*1.5,ht,note.d*beat*.5,'sine',.04,ctx); ht+=note.d*beat; });
        const bass=[{n:'C4',d:2},{n:'G3',d:2},{n:'A3',d:2},{n:'G3',d:2},{n:'C4',d:2},{n:'G3',d:1},{n:'A3',d:1},{n:'C4',d:2}];
        let bt=start; bass.forEach(note=>{ pNote(N[note.n],bt,note.d*beat*.8,'sine',.07,ctx); bt+=note.d*beat; });
        for(let i=0;i<16;i++){ pWoodblock(start+i*beat,ctx); if(i%4===0)pBell(N['G5'],start+i*beat,ctx); if(i%8===4)pBell(N['E5'],start+i*beat,ctx); }
        const loopDur=MELODY.reduce((s,n)=>s+n.d*beat,0);
        musicTimer=setTimeout(scheduleLoop,(loopDur-.3)*1000);
    }
    function startMusic(){ if(musicPlaying)return; musicPlaying=true; scheduleLoop(); document.getElementById('musicIcon').textContent='🎶'; document.getElementById('musicToggle').classList.add('playing'); }
    function stopMusic(){ musicPlaying=false; clearTimeout(musicTimer); document.getElementById('musicIcon').textContent='🎵'; document.getElementById('musicToggle').classList.remove('playing'); }

    // ========== RIPPLE ==========
    function addRipple(btn, e) {
        const r = btn.getBoundingClientRect();
        const x = (e.clientX||r.left+r.width/2)-r.left, y = (e.clientY||r.top+r.height/2)-r.top;
        const size = Math.max(r.width,r.height);
        const rip = document.createElement('span'); rip.className='ripple';
        rip.style.cssText=`width:${size}px;height:${size}px;left:${x-size/2}px;top:${y-size/2}px;`;
        btn.appendChild(rip); rip.addEventListener('animationend',()=>rip.remove());
    }
    document.addEventListener('click',e=>{ const btn=e.target.closest('.rbtn,.rbtn-music,.box-rbtn,.rbtn-primary,.rbtn-gold,.rbtn-teal,.rbtn-danger'); if(btn)addRipple(btn,e); });

    }

    function showPrizeModal(){
        document.getElementById('prizeList').innerHTML=prizes.map(p=>`
            <div class="glass-panel rounded-2xl p-4 text-center" style="border-color:rgba(253,230,138,0.2);">
                <div class="text-4xl mb-2">${p.icon}</div>
                <h3 class="text-sm font-bold mb-1" style="color:#fbbf24;font-family:'Amiri',serif;">${p.name}</h3>
                <div class="rounded-lg py-2 px-3" style="background:rgba(0,0,0,0.4);">
                    <p class="text-base font-bold" style="color:#fde68a;">${p.value}</p>
                </div>
            </div>`).join('');
        document.getElementById('prizeModal').classList.remove('hidden');
    }

    document.getElementById('soundToggle').onclick=()=>{ soundEnabled=!soundEnabled; document.getElementById('soundIcon').textContent=soundEnabled?'🔊':'🔇'; };
    document.getElementById('musicToggle').onclick=e=>{ if(musicPlaying){stopMusic();}else{startMusic();spawnFly(e.clientX-10,e.clientY-10);spawnFly(e.clientX+10,e.clientY-20);} };
    document.getElementById('liveChatBtn').onclick=()=>{ playSound('click'); window.open('https://static.zdassets.com/web_widget/latest/liveChat.html?v=10#key=hokiajaib4d.zendesk.com','_blank'); };
    document.getElementById('closePrizeModal').onclick=()=>{ playSound('click'); document.getElementById('prizeModal').classList.add('hidden'); };

    updateWinnerText();
    setInterval(updateWinnerText,12000);
    render();
    </script>
</body>
</html>
