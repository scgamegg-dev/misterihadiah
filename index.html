    width: 128px;
    height: 128px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-18deg) rotateY(25deg);
    animation: rotateCube 14s linear infinite;
    filter:
      drop-shadow(0 28px 45px rgba(0,0,0,.45))
      drop-shadow(0 0 22px rgba(251,191,36,.28));

  .mystery-cube::after{
    content:"";
    position:absolute;
    inset:-14px;
    border-radius: 22px;
    background: radial-gradient(circle at 50% 40%, rgba(251,191,36,.35), transparent 60%);
    filter: blur(10px);
    opacity: .75;
    transform: translateZ(-2px);
    animation: glowPulse 2.8s ease-in-out infinite;
    pointer-events:none;
  }
  .mystery-cube .face{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    border-radius: 16px;
    border: 2px solid rgba(148,163,184,.55);
    background: linear-gradient(135deg, #374151, #111827);
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.35),
      inset 0 18px 30px rgba(255,255,255,.06);
    backface-visibility: hidden;
  }
  .mystery-cube .face::before{
    content:"";
    position:absolute;
    inset: 10px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.10);
    pointer-events:none;
  }
  .mystery-cube .mark{
    font-size: 64px;
    font-weight: 900;
    background: linear-gradient(180deg, #FCD34D, #F59E0B);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 26px rgba(251,191,36,.9));
  }
  .mystery-cube .front  { transform: translateZ(64px); }
  .mystery-cube .back   { transform: rotateY(180deg) translateZ(64px); }
  .mystery-cube .right  { transform: rotateY( 90deg) translateZ(64px); }
  .mystery-cube .left   { transform: rotateY(-90deg) translateZ(64px); }
  .mystery-cube .top    { transform: rotateX( 90deg) translateZ(64px); }
  .mystery-cube .bottom { transform: rotateX(-90deg) translateZ(64px); }
  .mystery-cube .right,
  .mystery-cube .left{
    background: linear-gradient(135deg, #2f3a4a, #0b1220);
  }
  .mystery-cube .top{
    background: linear-gradient(135deg, #4b5563, #1f2937);
  }
  .mystery-cube .bottom{
    background: linear-gradient(135deg, #1f2937, #0b1220);
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.45),
      inset 0 30px 40px rgba(0,0,0,.35);
  }
  .mystery-stage::after{
    content:"";
    display:block;
    width: 150px;
    height: 28px;
    margin: 14px auto 0;
    background: radial-gradient(closest-side, rgba(0,0,0,.6), transparent 72%);
    filter: blur(2px);
    opacity: .9;
  }

  @keyframes rotateCube{
  0%   { transform: rotateX(-20deg) rotateY(0deg); }
  50%  { transform: rotateX(-12deg) rotateY(180deg); }
  100% { transform: rotateX(-20deg) rotateY(360deg); }
}

  @keyframes glowPulse{
    0%,100% { opacity:.55; transform: translateZ(-2px) scale(1); }
    50%     { opacity:.95; transform: translateZ(-2px) scale(1.03); }
  }
</style>

        // Generate Winner Text
        function generateWinnerText() {
            const prefixes = ['VIP', 'KING', 'ACE', 'PRO', 'STAR'];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            const number = Math.floor(Math.random() * 100).toString().padStart(2, '0');
            const username = `${prefix}_***${number}`;
            const randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
            return `${randomPrize.icon} ${username} memenangkan ${randomPrize.value}! ✨ `;

        // Sound
        function playSound(type) {

            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'click') {

                gain.gain.setValueAtTime(0.3, ctx.currentTime);

                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            }
        }

}

                        <div class="text-4xl font-black mb-4" style="background: linear-gradient(180deg, #FCD34D, #F59E0B, #D97706); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">

            userId = input;
            stage = 'select';
            isShuffling = true;
            render();

            let count = 0;
            const interval = setInterval(() => {
                shuffleOrder.sort(() => Math.random() - 0.5);
                count++;
                render();
                if (count >= 8) {
                    clearInterval(interval);
                    isShuffling = false;
                    render();
                }
            }, 250);
        }

        function selectBox(index) {
            if (isShuffling) return;
            playSound('click');
            selectedBox = index;
            
            setTimeout(() => {
                prize = prizes[Math.floor(Math.random() * 2) + 2];
                stage = 'result';
                render();
            }, 1500);
        }

        function resetGame() {
            stage = 'welcome';
            userId = '';
            selectedBox = null;
            prize = null;
            render();
