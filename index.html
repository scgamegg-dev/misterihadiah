<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mystery Box Giveaway • Glass 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{
      --goldA:#fff7cc;
      --goldB:#ffd86b;
      --goldC:#ffb12c;
      --ink:#05060b;
      --glass: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.16);
    }

    /* -------- 3D animated background (no canvas, pure CSS) -------- */
    .bg3d{
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      background:
        radial-gradient(1200px 800px at 15% 25%, rgba(255,216,107,.16), transparent 55%),
        radial-gradient(900px 650px at 85% 25%, rgba(255,255,255,.06), transparent 55%),
        radial-gradient(900px 500px at 50% 100%, rgba(255,177,44,.10), transparent 65%),
        linear-gradient(180deg, #05060b, #020309);
    }
    .bg3d::before{
      content:"";
      position:absolute;
      inset:-20%;
      background:
        conic-gradient(from 90deg at 50% 50%,
          rgba(255,216,107,.09),
          rgba(255,255,255,.05),
          rgba(255,177,44,.08),
          rgba(255,255,255,.04),
          rgba(255,216,107,.09));
      filter: blur(35px);
      opacity:.7;
      animation: drift 14s ease-in-out infinite;
      transform: translate3d(0,0,0);
    }
    .bg3d::after{
      content:"";
      position:absolute;
      inset:-30%;
      background:
        radial-gradient(circle at 30% 40%, rgba(255,216,107,.12), transparent 55%),
        radial-gradient(circle at 70% 60%, rgba(255,255,255,.07), transparent 55%);
      filter: blur(50px);
      opacity:.65;
      animation: drift2 18s ease-in-out infinite;
      transform: translate3d(0,0,0);
    }
    @keyframes drift{
      0%,100%{ transform: translate3d(-2%, -2%, 0) rotate(0deg) scale(1.02); }
      50%{ transform: translate3d(2%, 2%, 0) rotate(8deg) scale(1.06); }
    }
    @keyframes drift2{
      0%,100%{ transform: translate3d(2%, -1%, 0) rotate(0deg) scale(1.02); }
      50%{ transform: translate3d(-2%, 2%, 0) rotate(-10deg) scale(1.07); }
    }

    /* -------- Sparkles -------- */
    .sparkle{
      position:absolute;
      width:2px;height:2px;border-radius:999px;
      background: rgba(255,247,204,.95);
      box-shadow: 0 0 10px rgba(255,216,107,.9), 0 0 22px rgba(255,177,44,.45);
      opacity:.55;
      animation: sparkleFloat 7.5s linear infinite;
    }
    @keyframes sparkleFloat{
      from{ transform: translate3d(0, 10vh, 0); opacity:.12; }
      20%{ opacity:.85; }
      to{ transform: translate3d(0, -130vh, 0); opacity:.08; }
    }

    /* -------- Marquee -------- */
    @keyframes marquee{ 0%{transform:translateX(100%)} 100%{transform:translateX(-100%)} }
    .animate-marquee{ display:inline-block; animation: marquee 38s linear infinite; }

    /* -------- Glass card -------- */
    .glass{
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
      border: 1px solid var(--stroke);
      box-shadow: 0 30px 90px rgba(0,0,0,.55);
      backdrop-filter: blur(14px);
    }

    /* -------- 3D Mystery Cube -------- */
    @keyframes floatSoft{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    @keyframes glowPulse{ 0%,100%{opacity:.55; transform: translateZ(-2px) scale(1);} 50%{opacity:1; transform: translateZ(-2px) scale(1.05);} }
    @keyframes shimmer{ 0%{transform:translateX(-45%) rotate(10deg);opacity:.22} 50%{transform:translateX(10%) rotate(10deg);opacity:.70} 100%{transform:translateX(65%) rotate(10deg);opacity:.22} }
    @keyframes rotateCube{ 0%{transform:rotateX(-18deg) rotateY(0deg)} 100%{transform:rotateX(-18deg) rotateY(360deg)} }

    .mystery-stage{ perspective: 1200px; animation: floatSoft 4.6s ease-in-out infinite; }
    .mystery-cube{
      width: 160px; height:160px; position:relative;
      transform-style:preserve-3d;
      transform: rotateX(-18deg) rotateY(16deg);
      animation: rotateCube 16s linear infinite;
      filter: drop-shadow(0 28px 60px rgba(0,0,0,.6))
              drop-shadow(0 0 34px rgba(255,177,44,.35))
              drop-shadow(0 0 70px rgba(255,216,107,.18));
    }
    .mystery-cube::after{
      content:""; position:absolute; inset:-22px; border-radius:30px;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,216,107,.45), transparent 62%),
        radial-gradient(circle at 50% 60%, rgba(255,247,204,.22), transparent 65%);
      filter: blur(12px);
      opacity:.85;
      transform: translateZ(-2px);
      animation: glowPulse 2.6s ease-in-out infinite;
      pointer-events:none;
    }
    .mystery-cube .face{
      position:absolute; inset:0; display:grid; place-items:center;
      border-radius:20px;
      border: 1px solid rgba(255,255,255,.22);
      background:
        linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.05)),
        radial-gradient(320px 220px at 35% 25%, rgba(255,216,107,.28), transparent 55%),
        radial-gradient(260px 180px at 70% 70%, rgba(255,177,44,.20), transparent 60%),
        linear-gradient(180deg, rgba(16,16,24,.92), rgba(6,6,10,.98));
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.35), inset 0 18px 40px rgba(255,255,255,.06);
      backface-visibility:hidden;
      overflow:hidden;
    }
    .mystery-cube .face::before{
      content:""; position:absolute; inset:10px; border-radius:16px;
      border: 1px solid rgba(255,216,107,.42);
      box-shadow: 0 0 20px rgba(255,216,107,.14), inset 0 0 16px rgba(255,216,107,.08);
      pointer-events:none;
    }
    .mystery-cube .face::after{
      content:""; position:absolute; inset:-45%;
      background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,.18), transparent 65%);
      transform: translateX(-35%) rotate(10deg);
      animation: shimmer 4.2s ease-in-out infinite;
      pointer-events:none;
      mix-blend-mode: screen;
    }
    .mystery-cube .mark{
      font-size: 78px; font-weight: 900;
      background: linear-gradient(180deg, var(--goldA), var(--goldB), var(--goldC));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      filter: drop-shadow(0 0 24px rgba(255,216,107,.95)) drop-shadow(0 0 54px rgba(255,177,44,.35));
      letter-spacing: 1px;
    }

    /* Depth: half of 160 => 80px */
    .mystery-cube .front  { transform: translateZ(80px); }
    .mystery-cube .back   { transform: rotateY(180deg) translateZ(80px); }
    .mystery-cube .right  { transform: rotateY( 90deg) translateZ(80px); }
    .mystery-cube .left   { transform: rotateY(-90deg) translateZ(80px); }
    .mystery-cube .top    { transform: rotateX( 90deg) translateZ(80px); }
    .mystery-cube .bottom { transform: rotateX(-90deg) translateZ(80px); }

    .mystery-stage::after{
      content:""; display:block; width:210px; height:40px; margin:18px auto 0;
      background: radial-gradient(closest-side, rgba(0,0,0,.75), transparent 72%);
      filter: blur(2px); opacity:.95;
    }

    /* Premium hover */
    .tilt-card{
      transform-style:preserve-3d;
      transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
    }
    .tilt-card:hover{
      transform: translateY(-5px) rotateX(6deg) rotateY(-8deg) scale(1.04);
      box-shadow: 0 26px 85px rgba(0,0,0,.5);
      filter: brightness(1.08);
    }
  </style>
</head>

<body class="min-h-screen overflow-x-hidden text-white">
  <div class="bg3d"></div>
  <div id="sparkles" class="fixed inset-0 pointer-events-none -z-10"></div>

  <!-- Running Text -->
  <div class="fixed top-0 left-0 right-0 z-20 shadow-2xl border-b border-white/15"
       style="background: linear-gradient(90deg, rgba(255,247,204,.98), rgba(255,216,107,.98), rgba(255,177,44,.98));">
    <div class="overflow-hidden py-3">
      <div class="animate-marquee whitespace-nowrap">
        <span id="winnerText" class="text-sm md:text-base font-extrabold text-black"></span>
      </div>
    </div>
  </div>

  <!-- Sound Toggle -->
  <button id="soundToggle"
          class="fixed top-20 right-4 z-20 rounded-full p-3 border shadow-lg hover:scale-105 transition"
          style="background: linear-gradient(135deg, rgba(255,247,204,.98), rgba(255,216,107,.98));
                 border-color: rgba(255,255,255,.35);">
    <span id="soundIcon" class="text-black">🔊</span>
  </button>

  <!-- Live Chat Button -->
  <button id="liveChatBtn"
          class="fixed bottom-6 right-6 z-30 rounded-full px-5 py-3 border shadow-2xl hover:scale-110 transition"
          style="background: linear-gradient(135deg, rgba(255,247,204,.98), rgba(255,216,107,.98));
                 border-color: rgba(255,255,255,.35);">
    <div class="flex flex-col items-center gap-1">
      <span class="text-2xl text-black">⌯⌲</span>
      <span class="text-xs font-extrabold text-black whitespace-nowrap">LIVE CHAT</span>
    </div>
  </button>

  <!-- App -->
  <div id="app" class="min-h-screen flex items-center justify-center p-4 pt-24"></div>

  <!-- Prize List Modal -->
  <div id="prizeModal" class="hidden fixed inset-0 bg-black/80 z-50 overflow-y-auto">
    <div class="min-h-screen flex items-center justify-center p-4 py-8">
      <div class="max-w-2xl w-full rounded-3xl p-6 md:p-8 glass">
        <div class="text-center mb-6">
          <h2 class="text-2xl md:text-4xl font-black text-transparent bg-clip-text"
              style="background-image: linear-gradient(180deg, var(--goldA), var(--goldB), var(--goldC));">
            🎁 DAFTAR HADIAH
          </h2>
          <p class="text-white/70 text-sm">Hadiah campaign / event.</p>
        </div>

        <div id="prizeList" class="space-y-4 mb-6"></div>

        <button id="closePrizeModal"
                class="w-full py-4 rounded-xl font-black border hover:scale-[1.01] transition"
                style="background: linear-gradient(135deg, rgba(255,247,204,.98), rgba(255,216,107,.98));
                       color:#000; border-color: rgba(255,255,255,.35);">
          ❌ Tutup
        </button>
      </div>
    </div>
  </div>

  <script>
    // Netral: hadiah untuk event / promo
    const prizes = [
      { name: 'Voucher 100K', value: 'Rp 100.000', icon: '🎟️' },
      { name: 'Voucher 150K', value: 'Rp 150.000', icon: '🎁' },
      { name: 'Voucher 200K', value: 'Rp 200.000', icon: '✨' },
      { name: 'Voucher 500K', value: 'Rp 500.000', icon: '🏆' },
      { name: 'Merch Premium', value: 'Gift Box', icon: '📦' }
    ];

    let stage = 'welcome';
    let userId = '';
    let claimedUsers = [];
    let soundEnabled = true;

    function createSparkles(){
      const container = document.getElementById('sparkles');
      container.innerHTML = "";
      const count = 70;
      for(let i=0;i<count;i++){
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = Math.random() * 100 + '%';
        s.style.top  = (60 + Math.random() * 70) + '%';
        s.style.animationDelay = (Math.random() * 6) + 's';
        s.style.animationDuration = (6 + Math.random() * 10) + 's';
        s.style.opacity = (0.10 + Math.random() * 0.75);
        container.appendChild(s);
      }
    }

    function generateUsername(){
      const prefixes = ['member_', 'player_', 'lucky_', 'winner_', 'vip_', 'star_'];
      const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
      const lastTwo = Math.floor(Math.random() * 100).toString().padStart(2,'0');
      return `${prefix}***${lastTwo}`;
    }

    function updateWinnerText(){
      let text = '';
      const emojis = ['✨','👑','⭐','💎','🎉','🏆'];
      for(let i=0;i<8;i++){
        const u = generateUsername();
        const p = prizes[Math.floor(Math.random() * prizes.length)];
        const e = emojis[Math.floor(Math.random() * emojis.length)];
        text += `${e} Selamat kepada ${u} mendapatkan ${p.value}! `;
      }
      document.getElementById('winnerText').textContent = text;
    }

    function playSound(type){
      if(!soundEnabled) return;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if(type === 'click'){
        osc.frequency.setValueAtTime(650, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(980, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.22, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.10);
        osc.start(); osc.stop(ctx.currentTime + 0.10);
      }
      if(type === 'win'){
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.16, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
            o.start(); o.stop(ctx.currentTime + 0.25);
          }, idx * 130);
        });
      }
    }

    function renderWelcome(){
      return `
        <div class="text-center w-full max-w-2xl">
          <div class="glass rounded-3xl p-7 md:p-9 mb-7">
            <div class="text-4xl md:text-6xl font-black tracking-wide">
              <span style="background-image: linear-gradient(180deg, var(--goldA), var(--goldB), var(--goldC)); -webkit-background-clip:text; color:transparent;">MYSTERY</span>
              <span class="text-white">BOX</span>
            </div>
            <p class="mt-2 text-white/70 text-sm md:text-base">Giveaway / Event • Glass 3D • Premium</p>
          </div>

          <div class="flex justify-center mb-7">
            <div class="mystery-stage">
              <div class="mystery-cube" aria-label="Mystery Box 3D">
                <div class="face front"><span class="mark">?</span></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
              </div>
            </div>
          </div>

          <div class="glass rounded-2xl p-6 mb-7 max-w-xl mx-auto">
            <p class="text-white/90 text-base md:text-lg font-semibold leading-relaxed">
              🎁 Event Mystery Box<br/>
              <span class="text-yellow-200">Masukkan ID / Nama, lalu pilih 1 box</span><br/>
              <span class="text-sm text-white/60">Tampilan transparan & elegan dengan background 3D.</span>
            </p>
          </div>

          <button id="showPrizesBtn"
                  class="w-full md:w-auto px-10 py-4 rounded-full font-black border shadow-xl hover:scale-[1.03] transition mb-4
                         border-white/20 bg-blue-600/90 hover:bg-blue-600">
            📜 LIST HADIAH
          </button>

          <div class="mt-2">
            <button id="startBtn"
                    class="w-full md:w-auto px-12 py-5 rounded-full font-black text-xl md:text-2xl border shadow-2xl hover:scale-105 transition"
                    style="background: linear-gradient(135deg, rgba(255,247,204,.98), rgba(255,216,107,.98), rgba(255,177,44,.98));
                           color:#000; border-color: rgba(255,255,255,.40);">
              MULAI
            </button>
          </div>
        </div>
      `;
    }

    function renderInput(){
      return `
        <div class="w-full max-w-md">
          <div class="glass rounded-3xl p-7">
            <div class="text-center mb-6">
              <h2 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text"
                  style="background-image: linear-gradient(180deg, var(--goldA), var(--goldB), var(--goldC));">
                Masukkan ID / Nama
              </h2>
              <p class="text-white/60 text-sm mt-2">Untuk klaim hadiah event.</p>
            </div>

            <input id="userIdInput" type="text" placeholder="Contoh: member_***88"
              class="w-full px-5 py-4 rounded-xl bg-black/35 border border-white/15 text-white placeholder-white/40
                     focus:outline-none focus:border-yellow-200/70" />

            <div id="errorMsg" class="hidden mt-4 rounded-xl border border-red-500/40 bg-red-950/40 text-red-200 px-4 py-3 text-sm"></div>

            <button id="continueBtn"
              class="w-full mt-5 py-4 rounded-xl font-black border shadow-lg hover:scale-[1.01] transition"
              style="background: linear-gradient(135deg, rgba(255,247,204,.98), rgba(255,216,107,.98), rgba(255,177,44,.98));
                     color:#000; border-color: rgba(255,255,255,.40);">
              Lanjutkan
            </button>

            <button id="backBtn"
              class="w-full mt-3 py-3 rounded-xl font-bold border border-white/12 bg-white/5 hover:bg-white/8 transition">
              ⟵ Kembali
            </button>
          </div>
        </div>
      `;
    }

    function renderBoxSelection(){
      let boxes = '';
      for(let i=0;i<9;i++){
        boxes += `
          <button class="box-btn tilt-card aspect-square rounded-2xl border shadow-2xl p-3 flex flex-col items-center justify-center
                         border-white/15 bg-white/5 hover:bg-white/8"
                  data-index="${i}">
            <div class="text-sm md:text-lg font-black tracking-wide text-transparent bg-clip-text"
                 style="background-image: linear-gradient(180deg, var(--goldA), var(--goldB), var(--goldC));">
              MYSTERY
            </div>
            <div class="mt-2 text-4xl md:text-5xl">📦</div>
            <div class="mt-2 text-xs text-white/60">PILIH</div>
          </button>
        `;
      }

      return `
        <div class="text-center w-full max-w-2xl">
          <div class="glass rounded-2xl p-5 mb-7">
            <h2 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text"
                style="background-image: linear-gradient(180deg, var(--goldA), var(--goldB), var(--goldC));">
              PILIH 1 BOX
            </h2>
            <p class="text-white/60 text-sm mt-2">Klik satu box untuk melihat hadiah.</p>
          </div>

          <div class="grid grid-cols-3 gap-4 md:gap-6">
            ${boxes}
          </div>
        </div>
      `;
    }

    function renderResult(prize){
      const storedUser = localStorage.getItem("USER_ID") || "Unknown";
      return `
        <div class="w-full max-w-md">
          <div class="glass relative rounded-3xl p-7 md:p-10 text-center">
            <div class="absolute top-4 left-4 rounded-xl px-4 py-2 font-black shadow-lg border border-white/25 bg-green-600/90">
              ID: ${storedUser}
            </div>

            <div class="text-8xl mb-5">${prize.icon}</div>

            <h2 class="text-3xl md:text-4xl font-black text-transparent bg-clip-text mb-2"
                style="background-image: linear-gradient(180deg, var(--goldA), var(--goldB), var(--goldC));">
              SELAMAT! 🎉
            </h2>

            <p class="text-white/70 mb-5">Anda mendapatkan:</p>

            <div class="rounded-2xl py-6 px-6 border shadow-xl mb-6"
                 style="background: linear-gradient(135deg, rgba(255,247,204,.98), rgba(255,216,107,.98), rgba(255,177,44,.98));
                        border-color: rgba(255,255,255,.40);
                        color:#000;">
              <p class="text-3xl font-black">${prize.value}</p>
            </div>

            <button id="claimBtn"
              class="w-full py-4 rounded-xl font-black border shadow-lg hover:scale-[1.01] transition"
              style="background: linear-gradient(135deg, rgba(255,247,204,.98), rgba(255,216,107,.98), rgba(255,177,44,.98));
                     color:#000; border-color: rgba(255,255,255,.40);">
              Klaim (Demo)
            </button>

            <button id="resetBtn"
              class="w-full mt-3 py-3 rounded-xl font-bold border border-white/12 bg-white/5 hover:bg-white/8 transition">
              Kembali
            </button>
          </div>
        </div>
      `;
    }

    function render(){
      const app = document.getElementById('app');

      if(stage === 'welcome'){
        app.innerHTML = renderWelcome();
        document.getElementById('startBtn').onclick = () => { playSound('click'); stage='input'; render(); };
        document.getElementById('showPrizesBtn').onclick = () => { playSound('click'); showPrizeModal(); };
      }

      if(stage === 'input'){
        app.innerHTML = renderInput();
        document.getElementById('continueBtn').onclick = () => {
          playSound('click');
          const input = document.getElementById('userIdInput').value.trim();
          const error = document.getElementById('errorMsg');

          if(!input){ error.textContent='⚠️ Silahkan masukkan ID / Nama!'; error.classList.remove('hidden'); return; }
          if(claimedUsers.includes(input.toLowerCase())){
            error.textContent='⚠️ ID ini sudah pernah klaim!';
            error.classList.remove('hidden'); return;
          }

          userId = input;
          localStorage.setItem("USER_ID", userId);
          stage='select'; render();
        };
        document.getElementById('backBtn').onclick = () => { playSound('click'); stage='welcome'; render(); };
      }

      if(stage === 'select'){
        app.innerHTML = renderBoxSelection();
        document.querySelectorAll('.box-btn').forEach(btn => {
          btn.onclick = function(){
            playSound('click');
            document.querySelectorAll('.box-btn').forEach(b => b.disabled = true);

            this.style.transform = "translateY(-7px) rotateX(10deg) rotateY(-10deg) scale(1.07)";
            this.style.boxShadow = "0 34px 100px rgba(0,0,0,.58)";

            setTimeout(() => {
              const prize = prizes[Math.floor(Math.random() * prizes.length)];
              claimedUsers.push(userId.trim().toLowerCase());
              playSound('win');

              stage='result';
              app.innerHTML = renderResult(prize);

              document.getElementById('claimBtn').onclick = () => { playSound('click'); alert('Demo klaim berhasil!'); };
              document.getElementById('resetBtn').onclick = () => { playSound('click'); stage='welcome'; userId=''; render(); };
            }, 1100);
          };
        });
      }
    }

    function showPrizeModal(){
      const modal = document.getElementById('prizeModal');
      const prizeList = document.getElementById('prizeList');

      prizeList.innerHTML = prizes.map(p => `
        <div class="glass rounded-2xl p-6 tilt-card">
          <div class="text-center">
            <div class="text-6xl mb-3">${p.icon}</div>
            <h3 class="text-xl font-black mb-2 text-transparent bg-clip-text"
                style="background-image: linear-gradient(180deg, var(--goldA), var(--goldB), var(--goldC));">
              ${p.name}
            </h3>
            <div class="rounded-lg py-2 px-4 border border-white/12 bg-black/30">
              <p class="text-2xl font-black text-white">${p.value}</p>
            </div>
          </div>
        </div>
      `).join('');

      modal.classList.remove('hidden');
    }

    document.getElementById('soundToggle').onclick = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇';
      playSound('click');
    };

    document.getElementById('liveChatBtn').onclick = () => {
      playSound('click');
