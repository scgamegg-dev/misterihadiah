<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treasure Spin (For Fun)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes marquee { 0%{transform:translateX(100%)} 100%{transform:translateX(-100%)} }
    .animate-marquee { display:inline-block; animation: marquee 35s linear infinite; }

    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-26px)} }
    .animate-float { animation: float 8s ease-in-out infinite; }

    @keyframes glow { 0%,100%{box-shadow:0 0 25px rgba(234,179,8,.45)} 50%{box-shadow:0 0 55px rgba(234,179,8,.75)} }
    .animate-glow { animation: glow 2s ease-in-out infinite; }

    .sparkle { position:absolute; font-size:18px; opacity:.25; color:#eab308; }
  </style>
</head>
<body class="bg-gradient-to-br from-black via-gray-900 to-black min-h-screen overflow-x-hidden">

  <!-- Sparkles -->
  <div id="sparkles" class="fixed inset-0 pointer-events-none"></div>

  <!-- Running text (informational, not fake winners) -->
  <div class="fixed top-0 left-0 right-0 bg-gradient-to-r from-yellow-600 via-yellow-500 to-yellow-600 text-black py-3 overflow-hidden shadow-2xl z-10 border-b-4 border-yellow-400">
    <div class="animate-marquee whitespace-nowrap">
      <span id="infoText" class="text-sm md:text-base font-bold"></span>
    </div>
  </div>

  <!-- Main -->
  <div id="app" class="min-h-screen flex items-center justify-center p-4 pt-20"></div>

  <!-- Modal: Prize list -->
  <div id="prizeModal" class="hidden fixed inset-0 bg-black bg-opacity-80 z-50 overflow-y-auto">
    <div class="min-h-screen flex items-center justify-center p-4 py-8">
      <div class="bg-gradient-to-br from-gray-800 to-black rounded-3xl p-6 md:p-8 max-w-2xl w-full border-4 border-yellow-500 shadow-2xl">
        <div class="text-center mb-6">
          <h2 class="text-2xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-500 to-yellow-300 mb-2">
            🎁 Daftar Hadiah (For Fun)
          </h2>
          <p class="text-gray-300 text-sm">Hadiah berupa poin/badge untuk hiburan.</p>
        </div>
        <div id="prizeList" class="space-y-4 mb-6"></div>
        <button id="closePrizeModal" class="w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white font-bold py-4 rounded-xl text-xl shadow-lg transform hover:scale-105 transition border-2 border-red-400">
          ❌ Tutup
        </button>
      </div>
    </div>
  </div>

  <script>
    // ✅ Safe "prizes": points / badges (no money, no external claim links)
    const prizes = [
      { name: "Bonus Poin", value: "+50 Poin", icon: "✨" },
      { name: "Bonus Poin", value: "+100 Poin", icon: "🌟" },
      { name: "Lucky Badge", value: "Badge: Lucky Star", icon: "🏅" },
      { name: "XP Boost", value: "XP x2 (5 menit)", icon: "⚡" },
      { name: "Treasure Chest", value: "Chest: Bronze", icon: "🧰" },
      { name: "Treasure Chest", value: "Chest: Silver", icon: "🗝️" },
      { name: "Jackpot (Fun)", value: "+250 Poin", icon: "👑" },
    ];

    let stage = "welcome";
    let userTag = "";

    // Sparkles
    function createSparkles() {
      const container = document.getElementById("sparkles");
      for (let i = 0; i < 28; i++) {
        const s = document.createElement("div");
        s.textContent = "✨";
        s.className = "sparkle animate-float";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        s.style.animationDelay = Math.random() * 5 + "s";
        s.style.animationDuration = (5 + Math.random() * 10) + "s";
        container.appendChild(s);
      }
    }

    // Running info text (non-deceptive)
    const tips = [
      "Mode hiburan: hadiah berupa poin & badge, bukan uang.",
      "Pilih 1 box untuk dapat reward acak.",
      "Tip: Kamu bisa reset dan main lagi kapan saja.",
      "Semoga beruntung dan have fun!",
    ];
    function updateInfoText() {
      const t = tips[Math.floor(Math.random() * tips.length)];
      document.getElementById("infoText").textContent = "ℹ️ " + t + "   •   ";
    }

    // UI renders
    function renderWelcome() {
      return `
        <div class="text-center relative z-10">
          <div class="mb-8 bg-gradient-to-br from-gray-800 to-black rounded-3xl p-8 shadow-2xl animate-glow border-4 border-yellow-500">
            <div class="text-5xl md:text-7xl font-bold">
              <span class="text-yellow-500">TREASURE</span><span class="text-white">SPIN</span>
            </div>
            <div class="text-gray-300 text-sm mt-2">Mini-game (for fun)</div>
          </div>

          <h1 class="text-4xl md:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-500 via-yellow-300 to-yellow-500 mb-3">
            PILIH BOX KEJUTAN
          </h1>

          <div class="bg-gradient-to-br from-gray-800 to-black rounded-2xl p-6 mb-8 max-w-lg mx-auto border-2 border-yellow-500 shadow-2xl">
            <p class="text-white text-lg md:text-xl font-medium leading-relaxed">
              🎮 Hadiah berupa <span class="text-yellow-400">poin & badge</span> (hiburan).<br/>
              <span class="text-sm text-gray-300">Masukkan nickname lalu pilih 1 box.</span>
            </p>
          </div>

          <button id="showPrizesBtn" class="bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-4 px-12 rounded-full text-lg shadow-2xl transform hover:scale-105 transition mb-6 border-2 border-blue-400">
            📜 Lihat Reward
          </button>
          <br/>
          <button id="startBtn" class="bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 text-black font-bold py-5 px-16 rounded-full text-2xl shadow-2xl transform hover:scale-110 transition border-4 border-yellow-400">
            ▶ Mulai
          </button>
        </div>
      `;
    }

    function renderInput() {
      return `
        <div class="relative z-10 w-full max-w-md">
          <div class="bg-gradient-to-br from-gray-800 to-black rounded-3xl p-8 shadow-2xl border-4 border-yellow-500">
            <div class="text-center mb-6">
              <h2 class="text-2xl md:text-3xl font-bold text-yellow-400 mb-2">Masukkan Nickname</h2>
              <p class="text-gray-400 text-sm">Contoh: player88</p>
            </div>
            <input id="userTagInput" type="text" maxlength="20" placeholder="player88"
              class="w-full px-5 py-4 border-2 border-yellow-500 rounded-xl mb-4 text-lg focus:border-yellow-400 focus:outline-none bg-gray-900 text-white placeholder-gray-400">
            <div id="errorMsg" class="hidden bg-red-900 border-2 border-red-500 text-red-200 px-4 py-3 rounded-lg mb-4 text-sm"></div>
            <button id="continueBtn" class="w-full bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 text-black font-bold py-4 rounded-xl text-xl shadow-lg transform hover:scale-105 transition border-2 border-yellow-400">
              Lanjut
            </button>
          </div>
        </div>
      `;
    }

    function renderBoxSelection() {
      let boxes = "";
      for (let i = 0; i < 9; i++) {
        boxes += `
          <button class="box-btn aspect-square bg-gradient-to-br from-yellow-600 via-yellow-500 to-yellow-400 rounded-2xl shadow-2xl transform transition duration-300 border-4 border-yellow-400 flex flex-col items-center justify-center p-2 hover:scale-110 hover:rotate-6 cursor-pointer"
            data-index="${i}">
            <div class="text-xs md:text-sm font-bold mb-2 text-black/90">BOX #${i+1}</div>
            <span class="text-4xl md:text-5xl">🗃️</span>
          </button>
        `;
      }
      return `
        <div class="text-center relative z-10 w-full max-w-3xl">
          <div class="bg-gradient-to-br from-gray-800 to-black rounded-2xl p-6 mb-8 border-2 border-yellow-500">
            <h2 class="text-2xl md:text-3xl font-bold text-yellow-400">Pilih 1 Box, ${escapeHtml(userTag)}!</h2>
            <p class="text-gray-400 text-sm mt-1">Hasil acak untuk hiburan 🎮</p>
          </div>
          <div class="grid grid-cols-3 gap-4 md:gap-6">
            ${boxes}
          </div>
        </div>
      `;
    }

    function renderResult(prize) {
      return `
        <div class="relative z-10 w-full max-w-md">
          <div class="bg-gradient-to-br from-gray-800 to-black rounded-3xl p-8 md:p-10 shadow-2xl text-center border-4 border-yellow-500">
            <div class="absolute top-4 left-4 bg-green-600 text-white px-4 py-2 rounded-xl font-bold shadow-lg text-sm">
              Nick: ${escapeHtml(userTag)}
            </div>

            <div class="text-8xl mb-6">${prize.icon}</div>
            <h2 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-500 to-yellow-300 mb-3">
              Kamu Dapat!
            </h2>

            <div class="bg-gradient-to-r from-yellow-600 via-yellow-500 to-yellow-600 text-black py-6 px-6 rounded-2xl mb-6 shadow-xl border-4 border-yellow-400">
              <p class="text-xl font-semibold">${escapeHtml(prize.name)}</p>
              <p class="text-3xl font-bold">${escapeHtml(prize.value)}</p>
            </div>

            <p class="text-xs text-gray-400 mb-6">Catatan: ini mini-game hiburan (no cash / no claim link).</p>

            <button id="resetBtn" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-xl text-base transition border-2 border-gray-500">
              🔁 Main Lagi
            </button>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[m]);
    }

    function render() {
      const app = document.getElementById("app");

      if (stage === "welcome") {
        app.innerHTML = renderWelcome();
        document.getElementById("startBtn").onclick = () => { stage = "input"; render(); };
        document.getElementById("showPrizesBtn").onclick = () => showPrizeModal();
      }

      if (stage === "input") {
        app.innerHTML = renderInput();
        document.getElementById("continueBtn").onclick = () => {
          const v = document.getElementById("userTagInput").value.trim();
          const err = document.getElementById("errorMsg");
          if (!v) {
            err.textContent = "⚠️ Nickname tidak boleh kosong.";
            err.classList.remove("hidden");
            return;
          }
          userTag = v;
          stage = "select";
          render();
        };
      }

      if (stage === "select") {
        app.innerHTML = renderBoxSelection();
        document.querySelectorAll(".box-btn").forEach(btn => {
          btn.onclick = function() {
            this.classList.add("scale-125", "rotate-6");
            document.querySelectorAll(".box-btn").forEach(b => b.disabled = true);

            setTimeout(() => {
              const prize = prizes[Math.floor(Math.random() * prizes.length)];
              stage = "result";
              app.innerHTML = renderResult(prize);
              document.getElementById("resetBtn").onclick = () => {
                stage = "welcome";
                userTag = "";
                render();
              };
            }, 900);
          };
        });
      }
    }

    function showPrizeModal() {
      const modal = document.getElementById("prizeModal");
      const prizeList = document.getElementById("prizeList");
      prizeList.innerHTML = prizes.map(p => `
        <div class="bg-gradient-to-br from-yellow-600 to-yellow-500 rounded-2xl p-6 border-4 border-yellow-400 shadow-xl">
          <div class="text-center">
            <div class="text-6xl mb-3">${p.icon}</div>
            <h3 class="text-xl font-bold text-black mb-2">${escapeHtml(p.name)}</h3>
            <div class="bg-black/30 rounded-lg py-2 px-4">
              <p class="text-2xl font-bold text-white">${escapeHtml(p.value)}</p>
            </div>
          </div>
        </div>
      `).join("");
      modal.classList.remove("hidden");
    }

    document.getElementById("closePrizeModal").onclick = () => {
      document.getElementById("prizeModal").classList.add("hidden");
    };

    // Init
    createSparkles();
    updateInfoText();
    setInterval(updateInfoText, 9000);
    render();
  </script>
</body>
</html>
