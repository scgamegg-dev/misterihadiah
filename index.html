<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARAH HARTA AJAIB4D - 3D Mystery Box</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');
        
        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            overflow-x: hidden;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.6), 0 0 80px rgba(255, 215, 0, 0.3); }
            50% { box-shadow: 0 0 60px rgba(255, 215, 0, 0.9), 0 0 120px rgba(255, 215, 0, 0.5); }
        }

        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        @keyframes rotate3d {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            100% { transform: rotateY(360deg) rotateX(360deg); }
        }

        @keyframes bounce-chat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-marquee {
            animation: marquee 40s linear infinite;
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .animate-glow {
            animation: glow 2s ease-in-out infinite;
        }

        .animate-pulse-gold {
            animation: pulse-gold 2s ease-in-out infinite;
        }

        .animate-bounce-chat {
            animation: bounce-chat 2s ease-in-out infinite;
        }

        /* 3D Box Styles */
        .scene {
            perspective: 1000px;
            width: 200px;
            height: 200px;
            margin: 20px;
        }

        .box-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .box-3d:hover {
            transform: rotateY(20deg) rotateX(10deg) scale(1.1);
        }

        .box-face {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 3px solid rgba(255, 215, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(218, 165, 32, 0.3));
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
        }

        .box-face.front  { transform: rotateY(0deg) translateZ(100px); }
        .box-face.back   { transform: rotateY(180deg) translateZ(100px); }
        .box-face.right  { transform: rotateY(90deg) translateZ(100px); }
        .box-face.left   { transform: rotateY(-90deg) translateZ(100px); }
        .box-face.top    { transform: rotateX(90deg) translateZ(100px); }
        .box-face.bottom { transform: rotateX(-90deg) translateZ(100px); }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .gold-gradient {
            background: linear-gradient(135deg, #ffd700, #ffed4e, #ffd700);
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffd700;
            animation: float 3s ease-in-out infinite;
        }

        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: gold;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes particle-burst {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }

        .modal-overlay {
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">
    
    <!-- Animated Background Particles -->
    <div id="particles" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Running Text -->
    <div class="fixed top-0 left-0 right-0 bg-gradient-to-r from-yellow-600 via-yellow-400 to-yellow-600 text-black py-3 overflow-hidden shadow-2xl z-50 border-b-2 border-yellow-300">
        <div class="animate-marquee whitespace-nowrap">
            <span id="winnerText" class="text-sm md:text-base font-bold"></span>
        </div>
    </div>

    <!-- Sound Toggle -->
    <button id="soundToggle" class="fixed top-20 right-4 glass-card p-3 rounded-full hover:bg-yellow-500 hover:bg-opacity-30 transition shadow-lg z-50 border border-yellow-500">
        <span id="soundIcon" class="text-2xl">🔊</span>
    </button>

    <!-- Live Chat Button -->
    <button id="liveChatBtn" class="fixed bottom-6 right-6 gold-gradient hover:brightness-110 text-black font-bold py-3 px-5 rounded-full shadow-2xl z-50 transition transform hover:scale-110 animate-bounce-chat border-2 border-yellow-300">
        <div class="flex flex-col items-center gap-1">
            <span class="text-2xl">💬</span>
            <span class="text-xs whitespace-nowrap">LIVE CHAT 24/7</span>
        </div>
    </button>

    <!-- Main Container -->
    <div id="app" class="min-h-screen flex items-center justify-center p-4 pt-24 relative z-10"></div>

    <!-- Prize List Modal -->
    <div id="prizeModal" class="hidden fixed inset-0 modal-overlay z-50 overflow-y-auto">
        <div class="min-h-screen flex items-center justify-center p-4 py-8">
            <div class="glass-card rounded-3xl p-6 md:p-8 max-w-2xl w-full border-2 border-yellow-500 shadow-2xl animate-glow">
                <div class="text-center mb-6">
                    <h2 class="text-2xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-200 mb-2">
                        🎁 DAFTAR HADIAH EKSKLUSIF 🎁
                    </h2>
                    <p class="text-gray-300 text-sm">Hadiah Mewah Menanti Anda!</p>
                </div>
                <div id="prizeList" class="space-y-4 mb-6"></div>
                <button id="closePrizeModal" class="w-full bg-gradient-to-r from-red-600 to-red-500 hover:brightness-110 text-white font-bold py-4 rounded-xl text-xl shadow-lg transform hover:scale-105 transition border-2 border-red-400">
                    ❌ Tutup
                </button>
            </div>
        </div>
    </div>

    <script>
        const prizes = [
            { name: 'Saldo 100rb', value: 'Rp 100.000', icon: '💳' },
            { name: 'Saldo 150rb', value: 'Rp 150.000', icon: '💰' },
            { name: 'Saldo 200rb', value: 'Rp 200.000', icon: '💸' },
            { name: 'Saldo 500rb', value: 'Rp 500.000', icon: '🤑' },
            { name: 'Emas Batang 3gr', value: 'Emas 3 Gram', icon: '🥇' },
            { name: 'iPhone 17 Pro Max', value: 'iPhone 17 Pro Max', icon: '📱' },
            { name: 'MOTOR YAMAHA NMAX', value: 'MOTOR YAMAHA NMAX', icon: '🏍️' }
        ];

        let stage = 'welcome';
        let userId = '';
        let claimedUsers = [];
        let soundEnabled = true;

        // Create animated particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'sparkle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 3 + 's';
                particle.style.animationDuration = (3 + Math.random() * 4) + 's';
                container.appendChild(particle);
            }
        }

        // Generate username
        function generateUsername() {
            const prefixes = ['user_', 'member_', 'player_', 'lucky_', 'winner_', 'vip_', 'king_', 'ace_', 'star_'];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            const lastTwo = Math.floor(Math.random() * 100).toString().padStart(2, '0');
            return `${prefix}***${lastTwo}`;
        }

        function updateWinnerText() {
            let text = '';
            const emojis = ['✨', '🎉', '⭐', '🎊', '👑', '🚀', '💎', '🏆'];
            for (let i = 0; i < 8; i++) {
                const randomUser = generateUsername();
                const randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
                const emoji = emojis[Math.floor(Math.random() * emojis.length)];
                text += `${emoji} Selamat ${randomUser} mendapat ${randomPrize.value}! `;
            }
            document.getElementById('winnerText').textContent = text;
        }

        // Sound functions
        function playSound(type) {
            if (!soundEnabled) return;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    setTimeout(() => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.2, ctx.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                        o.start();
                        o.stop(ctx.currentTime + 0.3);
                    }, index * 150);
                });
            }
        }

        // Particle burst effect
        function createBurst(x, y) {
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = (Math.PI * 2 * i) / 20;
                const velocity = 50 + Math.random() * 50;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.animation = 'particle-burst 1s ease-out forwards';
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1000);
            }
        }

        // Render functions
        function renderWelcome() {
            return `
                <div class="text-center relative z-10 max-w-4xl mx-auto">
                    <div class="mb-8 glass-card rounded-3xl p-8 shadow-2xl animate-glow border-2 border-yellow-500">
                        <div class="text-6xl md:text-8xl font-bold animate-pulse-gold">
                            <span class="text-yellow-400">AJAIB</span><span class="text-white">4D</span>
                        </div>
                    </div>
                    
                    <div class="mb-6 animate-float">
                        <div class="text-9xl">🎁</div>
                    </div>
                    
                    <h1 class="text-5xl md:text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-yellow-200 to-yellow-400 mb-3 animate-pulse-gold">
                        MYSTERY BOX
                    </h1>
                    
                    <div class="flex items-center justify-center gap-3 mb-8">
                        <div class="h-1 w-20 bg-gradient-to-r from-transparent via-yellow-500 to-transparent"></div>
                        <span class="text-4xl text-yellow-400">✨</span>
                        <div class="h-1 w-20 bg-gradient-to-l from-transparent via-yellow-500 to-transparent"></div>
                    </div>
                    
                    <div class="glass-card rounded-2xl p-6 mb-8 max-w-lg mx-auto border-2 border-yellow-500 shadow-2xl">
                        <p class="text-white text-lg md:text-xl font-medium leading-relaxed">
                            ⚡ HADIAH EKSKLUSIF MENANTI ⚡<br/>
                            <span class="text-yellow-400">BUKA KOTAK & MASUKKAN USER ID</span><br/>
                            <span class="text-sm text-gray-300">Raih Hadiah Spektakuler Anda</span>
                        </p>
                    </div>
                    
                    <button id="showPrizesBtn" class="bg-gradient-to-r from-purple-600 to-purple-500 hover:brightness-110 text-white font-bold py-4 px-12 rounded-full text-lg shadow-2xl transform hover:scale-105 transition mb-6 border-2 border-purple-400">
                        💎 LIHAT HADIAH 💎
                    </button>
                    <br/>
                    <button id="startBtn" class="gold-gradient hover:brightness-110 text-black font-bold py-5 px-16 rounded-full text-2xl shadow-2xl transform hover:scale-110 transition animate-pulse-gold border-4 border-yellow-300">
                        🎯 BUKA KOTAK SEKARANG 🎯
                    </button>
                </div>
            `;
        }

        function renderInput() {
            return `
                <div class="relative z-10">
                    <div class="glass-card rounded-3xl p-8 shadow-2xl max-w-md w-full border-2 border-yellow-500 animate-glow">
                        <div class="text-center mb-6">
                            <div class="text-6xl mb-4 animate-pulse-gold">👤</div>
                            <h2 class="text-2xl md:text-3xl font-bold text-yellow-400 mb-2">Masukkan User ID</h2>
                            <p class="text-gray-400 text-sm">Untuk mengklaim hadiah eksklusif Anda</p>
                        </div>
                        <input type="text" id="userIdInput" placeholder="Contoh: user_***88" class="w-full px-5 py-4 border-2 border-yellow-500 rounded-xl mb-4 text-lg focus:border-yellow-400 focus:outline-none glass-card text-white placeholder-gray-400">
                        <div id="errorMsg" class="hidden bg-red-900 bg-opacity-50 border-2 border-red-500 text-red-200 px-4 py-3 rounded-lg mb-4 text-sm"></div>
                        <button id="continueBtn" class="w-full gold-gradient hover:brightness-110 text-black font-bold py-4 rounded-xl text-xl shadow-lg transform hover:scale-105 transition border-2 border-yellow-300">
                            ✨ Lanjutkan ✨
                        </button>
                    </div>
                </div>
            `;
        }

        function renderBoxSelection() {
            let boxes = '';
            const icons = ['🎁', '💎', '👑', '⭐', '🏆', '💰', '🎊', '✨', '🔥'];
            for (let i = 0; i < 9; i++) {
                boxes += `
                    <div class="scene">
                        <div class="box-3d box-btn" data-index="${i}">
                            <div class="box-face front">${icons[i]}</div>
                            <div class="box-face back">${icons[i]}</div>
                            <div class="box-face right">${icons[i]}</div>
                            <div class="box-face left">${icons[i]}</div>
                            <div class="box-face top">${icons[i]}</div>
                            <div class="box-face bottom">${icons[i]}</div>
                        </div>
                    </div>
                `;
            }
            return `
                <div class="text-center relative z-10">
                    <div class="glass-card rounded-2xl p-6 mb-8 border-2 border-yellow-500 animate-glow">
                        <h2 class="text-2xl md:text-4xl font-bold text-yellow-400">
                            🎯 PILIH MYSTERY BOX ANDA 🎯
                        </h2>
                        <p class="text-gray-300 mt-2">Klik kotak untuk membuka hadiah!</p>
                    </div>
                    <div class="grid grid-cols-3 gap-2 md:gap-4 max-w-3xl mx-auto justify-items-center">
                        ${boxes}
                    </div>
                </div>
            `;
        }

        function renderResult(prize) {
            const displayUserId = userId || "Unknown";
            return `
                <div class="relative z-10">
                    <div class="glass-card rounded-3xl p-8 md:p-12 shadow-2xl max-w-md w-full text-center border-4 border-yellow-500 animate-glow">
                        <div class="absolute top-4 left-4 bg-gradient-to-r from-green-500 to-green-400 text-white px-4 py-2 rounded-xl font-bold shadow-lg border-2 border-green-300">
                            User: ${displayUserId}
                        </div>

                        <div class="text-9xl mb-6 animate-bounce">${prize.icon}</div>

                        <h2 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-200 mb-3 animate-pulse-gold">
                            SELAMAT! 🎉
                        </h2>

                        <p class="text-xl text-gray-300 mb-4">Anda mendapatkan:</p>

                        <div class="gold-gradient text-black py-6 px-6 rounded-2xl mb-6 shadow-xl border-4 border-yellow-300">
                            <p class="text-3xl font-bold">${prize.value}</p>
                        </div>

                        <p class="text-sm text-gray-400 mb-6">💬 Klaim hadiah eksklusif Anda sekarang!</p>

                        <button id="claimBtn" class="w-full gold-gradient hover:brightness-110 text-black font-bold py-4 rounded-xl text-xl mb-3 shadow-lg transform hover:scale-105 transition border-2 border-yellow-300">
                            🎁 Klaim Hadiah Sekarang
                        </button>

                        <button id="resetBtn" class="w-full glass-card hover:bg-white hover:bg-opacity-10 text-white font-bold py-3 rounded-xl text-base transition border-2 border-gray-500">
                            🏠 Kembali ke Halaman Utama
                        </button>
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            if (stage === 'welcome') {
                app.innerHTML = renderWelcome();
                document.getElementById('startBtn').onclick = () => {
                    playSound('click');
                    stage = 'input';
                    render();
                };
                document.getElementById('showPrizesBtn').onclick = () => {
                    playSound('click');
                    showPrizeModal();
                };
            } else if (stage === 'input') {
                app.innerHTML = renderInput();
                document.getElementById('continueBtn').onclick = () => {
                    playSound('click');
                    const inputValue = document.getElementById('userIdInput').value.trim();
                    const errorMsg = document.getElementById('errorMsg');
                    
                    if (!inputValue) {
                        errorMsg.textContent = '⚠️ Silahkan masukkan User ID Anda!';
                        errorMsg.classList.remove('hidden');
                        return;
                    }
                    
                    if (claimedUsers.includes(inputValue.toLowerCase())) {
                        errorMsg.textContent = '⚠️ User ID ini sudah pernah mengklaim hadiah!';
                        errorMsg.classList.remove('hidden');
                        return;
                    }
                    
                    userId = inputValue;
                    stage = 'select';
                    render();
                };
            } else if (stage === 'select') {
                app.innerHTML = renderBoxSelection();
                document.querySelectorAll('.box-btn').forEach(btn => {
                    btn.onclick = function(e) {
                        playSound('click');
                        const rect = this.getBoundingClientRect();
                        createBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
                        
                        this.style.transform = 'rotateY(720deg) scale(1.2)';
                        this.style.transition = 'all 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                        document.querySelectorAll('.box-btn').forEach(b => b.style.pointerEvents = 'none');
                        
                        setTimeout(() => {
                            const realPrizes = [
                                { name: 'Saldo 100rb', value: 'Rp 100.000', icon: '💸' },
                                { name: 'Saldo 150rb', value: 'Rp 150.000', icon: '💰' },
                                { name: 'Saldo 200rb', value: 'Rp 200.000', icon: '💳' },
                                { name: 'Saldo 500rb', value: 'Rp 500.000', icon: '🤑' }
                            ];
                            const prize = realPrizes[Math.floor(Math.random() * realPrizes.length)];
                            claimedUsers.push(userId.trim().toLowerCase());
                            playSound('win');
                            stage = 'result';
                            app.innerHTML = renderResult(prize);
                            
                            document.getElementById('claimBtn').onclick = () => {
                                playSound('click');
                                window.open('https://one.ajaibraih.com/', '_blank');
                            };
                            document.getElementById('resetBtn').onclick = () => {
                                playSound('click');
                                stage = 'welcome';
                                userId = '';
                                render();
                            };
                        }, 1500);
                    };
                });
            }
        }

        function showPrizeModal() {
            const modal = document.getElementById('prizeModal');
            const prizeList = document.getElementById('prizeList');
            prizeList.innerHTML = prizes.map(prize => `
                <div class="glass-card rounded-2xl p-6 border-2 border-yellow-400 shadow-xl transform hover:scale-102 transition duration-300">
                    <div class="text-center">
                        <div class="text-6xl mb-3">${prize.icon}</div>
                        <h3 class="text-xl font-bold text-yellow-400 mb-2">${prize.name}</h3>
                        <div class="gold-gradient rounded-lg py-2 px-4">
                            <p class="text-2xl font-bold text-black">${prize.value}</p>
                        </div>
                    </div>
                </div>
            `).join('');
            modal.classList.remove('hidden');
        }

        // Event listeners
        document.getElementById('soundToggle').onclick = () => {
            soundEnabled = !soundEnabled;
            document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇';
        };

        document.getElementById('liveChatBtn').onclick = () => {
            playSound('click');
            window.open('https://static.zdassets.com/web_widget/latest/liveChat.html?v=10#key=hokiajaib4d.zendesk.com&settings=JTdCJTIyd2ViV2lkZ2V0JTIyJTNBJTdCJTIyY2hhdCUyMiUzQSU3QiUyMnRpdGxlJTIyJTNBbnVsbCUyQyUyMm1lbnVPcHRpb25zJTIyJTNBJTdCJTIyZW1haWxUcmFuc2NyaXB0JTIyJTNBdHJ1ZSU3RCUyQyUyMmRlcGFydG1lbnRzJTIyJTNBJTdCJTdEJTJDJTIycHJlY2hhdEZvcm0lMjIlM0ElN0IlMjJkZXBhcnRtZW50TGFiZWwlMjIlM0FudWxsJTJDJTIyZ3JlZXRpbmclMjIlM0FudWxsJTdEJTJDJTIyb2ZmbGluZUZvcm0lMjIlM0ElN0IlMjJncmVldGluZyUyMiUzQW51bGwlN0QlMkMlMjJjb25jaWVyZ2UlMjIlM0ElN0IlMjJhdmF0YXJQYXRoJTIyJTNBbnVsbCUyQyUyMm5hbWUlMjIlM0FudWxsJTJDJTIydGl0bGUlMjIlM0FudWxsJTdEJTdEJTJDJTIyY29sb3IlMjIlM0ElN0IlMjJhcnRpY2xlTGlua3MlMjIlM0ElMjIlMjIlMkMlMjJidXR0b24lMjIlM0ElMjIlMjIlMkMlMjJoZWFkZXIlMjIlM0ElMjIlMjIlMkMlMjJsYXVuY2hlciUyMiUzQSUyMiUyMiUyQyUyMmxhdW5ja
