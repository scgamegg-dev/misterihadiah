
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARAH HARTA AJAIB4D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap');

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee { display: inline-block; animation: marquee 40s linear infinite; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }
        .animate-float { animation: float 8s ease-in-out infinite; }

        @keyframes glow-gold {
            0%, 100% { box-shadow: 0 0 20px rgba(234,179,8,0.5), 0 0 40px rgba(234,179,8,0.2), inset 0 0 20px rgba(234,179,8,0.05); }
            50% { box-shadow: 0 0 40px rgba(234,179,8,0.8), 0 0 80px rgba(234,179,8,0.4), inset 0 0 30px rgba(234,179,8,0.1); }
        }
        .animate-glow { animation: glow-gold 2s ease-in-out infinite; }

        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-gold { animation: pulse-gold 2s ease-in-out infinite; }

        @keyframes bounce-chat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-chat { animation: bounce-chat 2s ease-in-out infinite; }

        .sparkle {
            position: absolute; font-size: 20px; opacity: 0.4;
            color: #eab308; pointer-events: none;
        }

        /* ===== GLASS BUTTONS ===== */
        .glass-btn {
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            font-weight: 800;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .glass-btn::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        .glass-btn:hover::before { left: 100%; }
        .glass-btn:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.1) 100%);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 20px rgba(234,179,8,0.3);
        }
        .glass-btn:active { transform: scale(0.97) !important; }

        .glass-btn-gold {
            background: linear-gradient(135deg, rgba(234,179,8,0.25), rgba(180,120,0,0.12));
            border: 1px solid rgba(234,179,8,0.45);
            box-shadow: 0 0 18px rgba(234,179,8,0.18), inset 0 1px 0 rgba(255,215,0,0.25);
            color: #fde68a;
        }
        .glass-btn-gold:hover {
            background: linear-gradient(135deg, rgba(234,179,8,0.4), rgba(180,120,0,0.25));
            border-color: rgba(234,179,8,0.9);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 40px rgba(234,179,8,0.5);
            color: #fff;
        }

        .glass-btn-blue {
            background: linear-gradient(135deg, rgba(59,130,246,0.25), rgba(29,78,216,0.12));
            border: 1px solid rgba(96,165,250,0.35);
            box-shadow: 0 0 15px rgba(59,130,246,0.15), inset 0 1px 0 rgba(147,197,253,0.25);
            color: #bfdbfe;
        }
        .glass-btn-blue:hover {
            background: linear-gradient(135deg, rgba(59,130,246,0.4), rgba(29,78,216,0.28));
            border-color: rgba(147,197,253,0.75);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 30px rgba(59,130,246,0.5);
            color: #fff;
        }

        .glass-btn-red {
            background: linear-gradient(135deg, rgba(239,68,68,0.25), rgba(185,28,28,0.12));
            border: 1px solid rgba(252,165,165,0.35);
            box-shadow: 0 0 15px rgba(239,68,68,0.15), inset 0 1px 0 rgba(252,165,165,0.25);
            color: #fecaca;
        }
        .glass-btn-red:hover {
            background: linear-gradient(135deg, rgba(239,68,68,0.4), rgba(185,28,28,0.28));
            border-color: rgba(252,165,165,0.75);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 30px rgba(239,68,68,0.5);
            color: #fff;
        }

        /* BOX buttons glass */
        .box-btn {
            position: relative;
            background: linear-gradient(135deg, rgba(234,179,8,0.18), rgba(80,40,0,0.1), rgba(234,179,8,0.12));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(234,179,8,0.35);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 12px rgba(234,179,8,0.12), inset 0 1px 0 rgba(255,215,0,0.18);
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .box-btn::after {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(255,215,0,0.12) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.3s;
        }
        .box-btn:hover {
            transform: translateY(-8px) scale(1.1) rotate(3deg);
            border-color: rgba(234,179,8,0.9);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 40px rgba(234,179,8,0.4), inset 0 1px 0 rgba(255,215,0,0.35);
        }
        .box-btn:hover::after { opacity: 1; }

        /* Glass panels */
        .glass-panel {
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .glass-panel-gold {
            background: linear-gradient(135deg, rgba(234,179,8,0.08), rgba(0,0,0,0.4));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(234,179,8,0.25);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 30px rgba(234,179,8,0.08), inset 0 1px 0 rgba(255,215,0,0.12);
        }

        /* Ocean */
        #ocean-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .ocean-overlay {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: radial-gradient(ellipse at 50% 0%, rgba(0,30,60,0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(0,10,30,0.6) 0%, transparent 60%),
                linear-gradient(180deg, rgba(0,20,50,0.2) 0%, rgba(0,5,20,0.5) 100%);
        }

        @keyframes bubble-rise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
        .bubble {
            position: fixed; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(100,200,255,0.2));
            border: 1px solid rgba(255,255,255,0.4);
            pointer-events: none; z-index: 2;
            animation: bubble-rise linear infinite;
        }
        @keyframes ray-shift {
            0%, 100% { opacity: 0.05; transform: skewX(-5deg) scaleX(1); }
            50% { opacity: 0.15; transform: skewX(5deg) scaleX(1.2); }
        }
        .light-ray {
            position: fixed; top: 0; width: 80px; height: 100vh;
            background: linear-gradient(180deg, rgba(100,210,255,0.3) 0%, transparent 70%);
            pointer-events: none; z-index: 2;
            animation: ray-shift ease-in-out infinite;
            transform-origin: top center;
        }
        body { overflow-x: hidden; }
        .ui-content { position: relative; z-index: 5; }

        @keyframes foam-wave {
            0%, 100% { transform: scaleX(1) translateX(0); }
            50% { transform: scaleX(1.1) translateX(-5%); }
        }
        .foam-layer {
            position: fixed; bottom: 0; left: -10%; width: 120%; height: 80px;
            background: radial-gradient(ellipse at 50% 100%, rgba(255,255,255,0.15) 0%, transparent 70%);
            animation: foam-wave 4s ease-in-out infinite;
            pointer-events: none; z-index: 3;
        }
        @keyframes caustic {
            0% { transform: rotate(0deg) scale(1); opacity: 0.04; }
            50% { transform: rotate(180deg) scale(1.3); opacity: 0.09; }
            100% { transform: rotate(360deg) scale(1); opacity: 0.04; }
        }
        .caustic-layer {
            position: fixed; inset: 0;
            background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(0,180,255,0.05) 0deg 30deg, rgba(0,100,200,0.02) 30deg 60deg);
            animation: caustic 20s linear infinite;
            pointer-events: none; z-index: 2;
        }

        /* Music button */
        @keyframes music-pulse {
            0%, 100% { box-shadow: 0 0 12px rgba(168,85,247,0.4), 0 0 25px rgba(168,85,247,0.18); }
            50% { box-shadow: 0 0 25px rgba(168,85,247,0.8), 0 0 50px rgba(168,85,247,0.4); }
        }
        .glass-btn-music {
            background: linear-gradient(135deg, rgba(168,85,247,0.22), rgba(109,40,217,0.12));
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(196,181,253,0.35);
            box-shadow: 0 0 12px rgba(168,85,247,0.25);
            color: #e9d5ff; font-weight: 800; overflow: hidden;
            transition: all 0.3s ease; cursor: pointer;
        }
        .glass-btn-music.playing { animation: music-pulse 1.5s ease-in-out infinite; }
        .glass-btn-music:hover {
            background: linear-gradient(135deg, rgba(168,85,247,0.38), rgba(109,40,217,0.28));
            border-color: rgba(196,181,253,0.75); color: #fff;
            transform: scale(1.08);
        }

        /* Flying notes */
        @keyframes note-fly {
            0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.6) rotate(25deg); }
        }
        .music-note { position: fixed; font-size: 22px; pointer-events: none; z-index: 100; animation: note-fly 1.4s ease-out forwards; }

        /* Ripple */
        @keyframes ripple-expand { to { transform: scale(4); opacity: 0; } }
        .ripple {
            position: absolute; border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: scale(0); animation: ripple-expand 0.6s linear;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden relative" style="background:#000d1a;">

                    <h2 class="text-3xl font-bold mb-2" style="font-family:'Cinzel',serif;background:linear-gradient(135deg,#fbbf24,#fde68a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">🎁 DAFTAR HADIAH 🎁</h2>
                    <p style="color:rgba(253,230,138,0.6);font-size:13px;">Hadiah Menarik Menanti Anda!</p>

            </div>

    <!-- 3D OCEAN -->
    <script>
    (function() {
        const canvas = document.getElementById('ocean-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000d1a, 1);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x001428, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 4, 12);

        const oceanGeo = new THREE.PlaneGeometry(100, 100, 128, 128);
        oceanGeo.rotateX(-Math.PI / 2);
        const oceanMat = new THREE.MeshPhongMaterial({ color: 0x0066bb, specular: 0x88ddff, shininess: 120, side: THREE.DoubleSide, transparent: true, opacity: 0.88 });
        scene.add(new THREE.Mesh(oceanGeo, oceanMat));

        const deepGeo = new THREE.PlaneGeometry(100, 100, 32, 32);
        deepGeo.rotateX(-Math.PI / 2);
        const deepMesh = new THREE.Mesh(deepGeo, new THREE.MeshPhongMaterial({ color: 0x002244, transparent: true, opacity: 0.6, side: THREE.DoubleSide }));
        deepMesh.position.y = -1.5; scene.add(deepMesh);

        scene.add(new THREE.AmbientLight(0x003366, 1.2));
        const sun = new THREE.DirectionalLight(0xffffff, 2.5); sun.position.set(20, 30, -10); scene.add(sun);
        const moon = new THREE.DirectionalLight(0x4488ff, 1.0); moon.position.set(-15, 20, 15); scene.add(moon);
        const s1 = new THREE.PointLight(0x00aaff, 3, 30); s1.position.set(0, 5, 0); scene.add(s1);
        const s2 = new THREE.PointLight(0xffdd44, 2, 20); s2.position.set(5, 3, -5); scene.add(s2);

        const foamCount = 500, fGeo = new THREE.BufferGeometry(), fPos = new Float32Array(foamCount * 3);
        for (let i = 0; i < foamCount; i++) { fPos[i*3]=(Math.random()-0.5)*100; fPos[i*3+1]=0.35; fPos[i*3+2]=(Math.random()-0.5)*100; }
        fGeo.setAttribute('position', new THREE.BufferAttribute(fPos, 3));
        scene.add(new THREE.Points(fGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.5 })));

        const bCount = 300, bGeo = new THREE.BufferGeometry(), bPos = new Float32Array(bCount * 3), bSpd = new Float32Array(bCount);
        for (let i = 0; i < bCount; i++) { bPos[i*3]=(Math.random()-0.5)*20; bPos[i*3+1]=-5+Math.random()*5; bPos[i*3+2]=(Math.random()-0.5)*20; bSpd[i]=0.005+Math.random()*0.015; }
        bGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
        scene.add(new THREE.Points(bGeo, new THREE.PointsMaterial({ color: 0xaaddff, size: 0.08, transparent: true, opacity: 0.7 })));

        const skyMat = new THREE.ShaderMaterial({
            uniforms: { time: { value: 0 } },
            vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
            fragmentShader: `varying vec2 vUv; uniform float time; void main(){ vec3 c=mix(vec3(0.0,0.3,0.6),vec3(0.0,0.05,0.2),vUv.y); c+=0.03*sin(vUv.x*20.0+time*0.5); gl_FragColor=vec4(c,1.0); }`,
        });
        const sky = new THREE.Mesh(new THREE.PlaneGeometry(200, 80), skyMat);
        sky.position.set(0, 10, -40); scene.add(sky);

        function wave(x, z, t) {
            return 0.45*Math.sin(0.4*x+t*0.9) + 0.35*Math.sin(0.35*z+t*0.7) + 0.25*Math.sin(0.25*(x+z)+t*1.1) + 0.15*Math.cos(0.5*x-0.3*z+t*1.3) + 0.12*Math.sin(0.7*z-t*0.6);
        }

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

        let camT = 0;
        (function animate() {
            requestAnimationFrame(animate);
            const t = performance.now() * 0.001;
            const pos = oceanGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) pos.setY(i, wave(pos.getX(i), pos.getZ(i), t));
            pos.needsUpdate = true; oceanGeo.computeVertexNormals();
            const fp = fGeo.attributes.position;
            for (let i = 0; i < foamCount; i++) fp.setY(i, wave(fp.getX(i), fp.getZ(i), t) + 0.1 + 0.05*Math.sin(t*3+i));
            fp.needsUpdate = true;
            const bp = bGeo.attributes.position;
            for (let i = 0; i < bCount; i++) { let by = bp.getY(i) + bSpd[i]; if (by > 0.5) { by = -5; bp.setX(i,(Math.random()-0.5)*20); bp.setZ(i,(Math.random()-0.5)*20); } bp.setY(i, by); }
            bp.needsUpdate = true;
            s1.position.x = 8*Math.sin(t*0.5); s1.position.z = 8*Math.cos(t*0.4); s1.intensity = 2.5+1.5*Math.sin(t*2);
            s2.position.x = -6*Math.cos(t*0.3); s2.position.z = 6*Math.sin(t*0.6);
            skyMat.uniforms.time.value = t;
            camT += 0.005; camera.position.y = 4+0.3*Math.sin(camT); camera.position.x = 0.5*Math.sin(camT*0.5);
            camera.lookAt(0, 0.5, 0);
            renderer.render(scene, camera);
        })();

        function spawnBubble() {
            const b = document.createElement('div'); b.className = 'bubble';
            const s = 4+Math.random()*16; b.style.width = s+'px'; b.style.height = s+'px';
            b.style.left = (Math.random()*100)+'%'; b.style.bottom = '0';
            const d = 6+Math.random()*10; b.style.animationDuration = d+'s'; b.style.animationDelay = (Math.random()*5)+'s';
            document.body.appendChild(b); setTimeout(() => b.remove(), (d+5)*1000);
        }
        for (let i = 0; i < 20; i++) spawnBubble();
        setInterval(spawnBubble, 1500);
    })();
    </script>

    <!-- MAIN LOGIC + MUSIC -->
    <script>
        // ========== MAHJONG MUSIC ==========
        let audioCtx = null;
        let musicPlaying = false;
        let musicTimer = null;

        function getCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        // Pentatonic Chinese scale notes (Hz)
        const N = {
            G3:196.00, A3:220.00, C4:261.63, D4:293.66, E4:329.63,
            G4:392.00, A4:440.00, C5:523.25, D5:587.33, E5:659.25,
            G5:783.99, A5:880.00, C6:1046.50
        };

        // Mahjong melody — upbeat pentatonic Chinese game feel
        const MELODY = [
            {n:'G4',d:0.25},{n:'A4',d:0.25},{n:'C5',d:0.5},
            {n:'A4',d:0.25},{n:'G4',d:0.25},{n:'E4',d:0.5},
            {n:'G4',d:0.25},{n:'A4',d:0.25},{n:'C5',d:0.25},{n:'D5',d:0.25},
            {n:'E5',d:0.5},{n:'D5',d:0.25},{n:'C5',d:0.25},
            {n:'A4',d:0.5},{n:'G4',d:0.5},
            {n:'C5',d:0.25},{n:'D5',d:0.25},{n:'E5',d:0.5},
            {n:'G5',d:0.25},{n:'E5',d:0.25},{n:'D5',d:0.25},{n:'C5',d:0.25},
            {n:'A4',d:0.25},{n:'G4',d:0.25},{n:'A4',d:0.5},
            {n:'C5',d:0.75},{n:'A4',d:0.25},
            {n:'G4',d:0.25},{n:'A4',d:0.25},{n:'C5',d:0.25},{n:'E5',d:0.25},
            {n:'D5',d:0.25},{n:'C5',d:0.25},{n:'A4',d:0.5},
            {n:'G4',d:0.25},{n:'C5',d:0.25},{n:'E5',d:0.25},{n:'G5',d:0.25},
            {n:'A5',d:0.5},{n:'G5',d:0.25},{n:'E5',d:0.25},
            {n:'D5',d:0.25},{n:'C5',d:0.25},{n:'A4',d:0.25},{n:'G4',d:0.25},
            {n:'C5',d:1.0},
        ];

        function pNote(freq, t, dur, type, vol, ctx) {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = type; o.frequency.value = freq;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vol, t + 0.02);
            g.gain.setValueAtTime(vol, t + dur * 0.75);
            g.gain.linearRampToValueAtTime(0, t + dur);
            o.start(t); o.stop(t + dur + 0.05);
        }

        function pWoodblock(t, ctx) {
            const buf = ctx.createBuffer(1, ctx.sampleRate * 0.07, ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(ctx.sampleRate*0.012));
            const src = ctx.createBufferSource();
            const bpf = ctx.createBiquadFilter();
            const g = ctx.createGain();
            bpf.type = 'bandpass'; bpf.frequency.value = 900; bpf.Q.value = 3;
            src.buffer = buf; src.connect(bpf); bpf.connect(g); g.connect(ctx.destination);
            g.gain.setValueAtTime(0.1, t); src.start(t); src.stop(t + 0.08);
        }

        function pBell(freq, t, ctx) {
            [1, 2.756].forEach(ratio => {
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.type = 'sine'; o.frequency.value = freq * ratio;
                g.gain.setValueAtTime(0.05, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
                o.start(t); o.stop(t + 1.9);
            });
        }

        function scheduleLoop() {
            if (!musicPlaying) return;
            const ctx = getCtx();
            const bpm = 132;
            const beat = 60 / bpm;
            const start = ctx.currentTime + 0.05;
            let t = start;

            // Main melody (triangle - soft flute-like)
            MELODY.forEach(note => {
                pNote(N[note.n], t, note.d * beat * 0.88, 'triangle', 0.11, ctx);
                t += note.d * beat;
            });

            // Harmony (+5th, lower volume)
            let ht = start;
            MELODY.forEach(note => {
                pNote(N[note.n] * 1.5, ht, note.d * beat * 0.5, 'sine', 0.04, ctx);
                ht += note.d * beat;
            });

            // Bass (root notes, sine)
            const bassSeq = [
                {n:'C4',d:2},{n:'G3',d:2},{n:'A3',d:2},{n:'G3',d:2},
                {n:'C4',d:2},{n:'G3',d:1},{n:'A3',d:1},{n:'C4',d:2},
            ];
            let bt = start;
            bassSeq.forEach(note => {
                pNote(N[note.n], bt, note.d * beat * 0.8, 'sine', 0.07, ctx);
                bt += note.d * beat;
            });

            // Percussion - woodblock every beat, bell every 4
            const totalBeats = 16;
            for (let i = 0; i < totalBeats; i++) {
                pWoodblock(start + i * beat, ctx);
                if (i % 4 === 0) pBell(N['G5'], start + i * beat, ctx);
                if (i % 8 === 4) pBell(N['E5'], start + i * beat, ctx);
            }

            // Schedule next loop
            const loopDur = MELODY.reduce((s, n) => s + n.d * beat, 0);
            musicTimer = setTimeout(scheduleLoop, (loopDur - 0.3) * 1000);
        }

        function startMusic() {
            if (musicPlaying) return;
            musicPlaying = true;

            document.getElementById('musicIcon').textContent = '🎶';

        // ========== RIPPLE ==========
        function addRipple(btn, e) {
            const r = btn.getBoundingClientRect();
            const x = (e.clientX || r.left + r.width/2) - r.left;
            const y = (e.clientY || r.top + r.height/2) - r.top;
            const size = Math.max(r.width, r.height);
            const rip = document.createElement('span');
            rip.className = 'ripple';
            rip.style.cssText = `width:${size}px;height:${size}px;left:${x-size/2}px;top:${y-size/2}px;`;
            btn.appendChild(rip);
            rip.addEventListener('animationend', () => rip.remove());
        }
