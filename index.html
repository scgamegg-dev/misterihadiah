<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HARTA KARUN AJAIB4D • Luxury 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* -----------------------------
       Luxury Motion + Background
    ------------------------------ */
    :root{
      --gold1: #f8d36a;
      --gold2: #f3b94a;
      --gold3: #b07a16;
      --ink:   #05060b;
      --glass: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.14);
    }

    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .animate-marquee{ display:inline-block; animation: marquee 40s linear infinite; }

    @keyframes floatSoft{
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-10px); }
    }
    .floatSoft{ animation: floatSoft 5s ease-in-out infinite; }

    @keyframes glowPulse{
      0%,100% { opacity:.55; transform: translateZ(-2px) scale(1); }
      50%     { opacity:.95; transform: translateZ(-2px) scale(1.03); }
    }

    @keyframes shimmer{
      0%   { transform: translateX(-40%) rotate(10deg); opacity:.25; }
      50%  { transform: translateX(10%) rotate(10deg); opacity:.60; }
      100% { transform: translateX(60%) rotate(10deg); opacity:.25; }
    }

    /* Subtle particle */
    .sparkle {
      position: absolute;
      width: 2px; height: 2px;
      border-radius: 999px;
      background: rgba(248, 211, 106, .85);
      box-shadow: 0 0 10px rgba(248, 211, 106, .65);
      opacity: .6;
      animation: sparkleFloat 8s linear infinite;
    }
    @keyframes sparkleFloat{
      from { transform: translate3d(0, 0, 0); opacity: .2; }
      20%  { opacity: .8; }
      to   { transform: translate3d(0, -120vh, 0); opacity: .1; }
    }

    /* -----------------------------
       Luxury 3D Mystery Cube
    ------------------------------ */
    .mystery-stage{
      perspective: 1100px;
      animation: floatSoft 4.8s ease-in-out infinite;
    }
    .mystery-cube{
      width: 150px;
      height: 150px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-18deg) rotateY(18deg);
      animation: rotateCube 16s linear infinite; /* pelan & elegan */
      filter:
        drop-shadow(0 28px 55px rgba(0,0,0,.55))
        drop-shadow(0 0 26px rgba(248,211,106,.25));
    }
    .mystery-cube::after{
      content:"";
      position:absolute;
      inset:-18px;
      border-radius: 26px;
      background: radial-gradient(circle at 50% 35%, rgba(248,211,106,.38), transparent 62%);
      filter: blur(12px);
      opacity: .75;
      transform: translateZ(-2px);
      animation: glowPulse 2.9s ease-in-out infinite;
      pointer-events:none;
    }

    .mystery-cube .face{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.18);
      background:
        linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.03)),
        radial-gradient(300px 200px at 30% 25%, rgba(248,211,106,.16), transparent 55%),
        linear-gradient(180deg, rgba(18,18,28,.9), rgba(6,6,10,.96));
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.35),
        inset 0 18px 35px rgba(255,255,255,.05);
      backface-visibility: hidden;
      overflow:hidden;
    }

    /* “foil” rim */
    .mystery-cube .face::before{
      content:"";
      position:absolute;
      inset: 10px;
      border-radius: 14px;
      border: 1px solid rgba(248,211,106,.26);
      box-shadow: 0 0 18px rgba(248,211,106,.12);
      pointer-events:none;
    }

    /* “shimmer” sweep */
    .mystery-cube .face::after{
      content:"";
      position:absolute;
      inset:-40%;
      background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,.14), transparent 65%);
      transform: translateX(-35%) rotate(10deg);
      animation: shimmer 4.6s ease-in-out infinite;
      pointer-events:none;
      mix-blend-mode: screen;
    }

    .mystery-cube .mark{
      font-size: 74px;
      font-weight: 900;
      background: linear-gradient(180deg, var(--gold1), var(--gold2), var(--gold3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 26px rgba(248,211,106,.85));
    }

    /* Depth: half of 150 => 75px */
    .mystery-cube .front  { transform: translateZ(75px); }
    .mystery-cube .back   { transform: rotateY(180deg) translateZ(75px); }
    .mystery-cube .right  { transform: rotateY( 90deg) translateZ(75px); }
    .mystery-cube .left   { transform: rotateY(-90deg) translateZ(75px); }
    .mystery-cube .top    { transform: rotateX( 90deg) translateZ(75px); }
    .mystery-cube .bottom { transform: rotateX(-90deg) translateZ(75px); }

    /* Side nuance for realism */
    .mystery-cube .right,
    .mystery-cube .left{
      background:
        linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.02)),
        radial-gradient(280px 180px at 40% 30%, rgba(248,211,106,.10), transparent 60%),
        linear-gradient(180deg, rgba(12,12,18,.92), rgba(5,5,8,.97));
    }
    .mystery-cube .top{
      background:
        linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.03)),
        radial-gradient(240px 160px at 50% 40%, rgba(248,211,106,.12), transparent 60%),
        linear-gradient(180deg, rgba(18,18,28,.92), rgba(8,8,12,.97));
    }
    .mystery-cube .bottom{
      background:
        radial-gradient(240px 160px at 50% 70%, rgba(0,0,0,.45), transparent 60%),
        linear-gradient(180deg, rgba(10,10,14,.96), rgba(2,2,4,.98));
    }

    /* Ground shadow */
    .mystery-stage::after{
      content:"";
      display:block;
      width: 190px;
      height: 36px;
      margin: 16px auto 0;
      background: radial-gradient(closest-side, rgba(0,0,0,.70), transparent 72%);
      filter: blur(2px);
      opacity: .95;
    }

    @keyframes rotateCube{
      0%   { transform: rotateX(-18deg) rotateY(0deg); }
      100% { transform: rotateX(-18deg) rotateY(360deg); }
    }

    /* Optional: premium hover tilt on selection boxes */
    .tilt-card{
      transform-style: preserve-3d;
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .tilt-card:hover{
      transform: translateY(-4px) rotateX(6deg) rotateY(-8deg) scale(1.03);
      box-shadow: 0 22px 70px rgba(0,0,0,.45);
    }

    /* Modal scroll bar nicer */
    .nice-scroll::-webkit-scrollbar{ width: 10px; }
    .nice-scroll::-webkit-scrollbar-thumb{
      background: rgba(248,211,106,.28);
      border-radius: 10px;
      border: 2px solid rgba(0,0,0,.35);
    }
  </style>
</head>

<body class="min-h-screen overflow-x-hidden text-white"
      style="background:
        radial-gradient(1200px 800px at 15% 30%, rgba(248,211,106,.10), transparent 55%),
        radial-gradient(900px 600px at 85% 20%, rgba(255,255,255,.05), transparent 55%),
        linear-gradient(180deg, #05060b, #03040a);">

  <!-- Elegant particles -->
  <div id="sparkles" class="fixed inset-0 pointer-events-none -z-10"></div>

  <!-- Running Text -->
  <div class="fixed top-0 left-0 right-0 z-20 shadow-2xl border-b border-yellow-500/30"
       style="background: linear-gradient(90deg, rgba(248,211,106,.95), rgba(243,185,74,.95), rgba(248,211,106,.95));">
    <div class="overflow-hidden py-3">
      <div class="animate-marquee whitespace-nowrap">
        <span id="winnerText" class="text-sm md:text-base font-extrabold text-black"></span>
      </div>
    </div>
  </div>

  <!-- Sound Toggle -->
  <button id="soundToggle"
          class="fixed top-20 right-4 z-20 rounded-full p-3 border shadow-lg hover:scale-105 transition"
          style="background: linear-gradient(135deg, rgba(248,211,106,.95), rgba(243,185,74,.95));
                 border-color: rgba(255,255,255,.35);">
    <span id="soundIcon" class="text-black">🔊</span>
  </button>

  <!-- Live Chat Button -->
  <button id="liveChatBtn"
          class="fixed bottom-6 right-6 z-30 rounded-full px-5 py-3 border shadow-2xl hover:scale-110 transition floatSoft"
          style="background: linear-gradient(135deg, rgba(248,211,106,.95), rgba(243,185,74,.95));
                 border-color: rgba(255,255,255,.35);">
    <div class="flex flex-col items-center gap-1">
      <span class="text-2xl text-black">⌯⌲</span>
      <span class="text-xs font-extrabold text-black whitespace-nowrap">LIVE CHAT 24/7</span>
    </div>
  </button>

  <!-- App -->
  <div id="app" class="min-h-screen flex items-center justify-center p-4 pt-24"></div>

  <!-- Prize List Modal -->
  <div id="prizeModal" class="hidden fixed inset-0 bg-black/80 z-50 overflow-y-auto nice-scroll">
    <div class="min-h-screen flex items-center justify-center p-4 py-8">
      <div class="max-w-2xl w-full rounded-3xl p-6 md:p-8 border shadow-2xl"
           style="background: radial-gradient(800px 500px at 30% 25%, rgba(248,211,106,.10), transparent 55%),
                              linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
                  border-color: rgba(255,255,255,.14);
                  backdrop-filter: blur(12px);">
        <div class="text-center mb-6">
          <h2 class="text-2xl md:text-4xl font-black text-transparent bg-clip-text"
              style="background-image: linear-gradient(180deg, var(--gold1), var(--gold2), var(--gold3));">
            🎁 DAFTAR HADIAH 🎁
          </h2>
          <p class="text-white/70 text-sm">Hadiah premium menanti Anda.</p>
        </div>

        <div id="prizeList" class="space-y-4 mb-6"></div>

        <button id="closePrizeModal"
                class="w-full py-4 rounded-xl font-black border hover:scale-[1.01] transition"
                style="background: linear-gradient(135deg, rgba(248,211,106,.95), rgba(243,185,74,.95));
                       color: #000;
                       border-color: rgba(255,255,255,.35);">
          ❌ Tutup
        </button>
      </div>
    </div>
  </div>

  <script>
    // =============================
    // Data
    // =============================
    const prizes = [
      { name: 'Saldo 100rb', value: 'Rp 100.000', icon: '💳' },
      { name: 'Saldo 150rb', value: 'Rp 150.000', icon: '💰' },
      { name: 'Saldo 200rb', value: 'Rp 200.000', icon: '💸' },
      { name: 'Saldo 500rb', value: 'Rp 500.000', icon: '🤑' },
      { name: 'Emas Batang 3gr', value: 'Emas 3 Gram', icon: '🥇' },
      { name: 'iPhone 17 Pro Max', value: 'iPhone 17 Pro Max', icon: '📲' },
      { name: 'MOTOR YAMAHA NMAX', value: 'MOTOR YAMAHA NMAX', icon: '🏍️' }
    ];

    // =============================
    // State
    // =============================
    let stage = 'welcome';
    let userId = '';
    let claimedUsers = [];
    let soundEnabled = true;

    // =============================
    // Elegant particles
    // =============================
    function createSparkles(){
      const container = document.getElementById('sparkles');
      container.innerHTML = "";
      const count = 55;
      for(let i=0;i<count;i++){
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = Math.random() * 100 + '%';
        s.style.top  = (60 + Math.random() * 60) + '%';
        s.style.animationDelay = (Math.random() * 6) + 's';
        s.style.animationDuration = (7 + Math.random() * 10) + 's';
        s.style.opacity = (0.15 + Math.random() * 0.65);
        container.appendChild(s);
      }
    }

    // =============================
    // Winner text
    // =============================
    function generateUsername(){
      const prefixes = ['user_', 'member_', 'player_', 'lucky_', 'winner_', 'pro_', 'vip_', 'king_', 'ace_', 'star_'];
      const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
      const lastTwo = Math.floor(Math.random() * 100).toString().padStart(2,'0');
      return `${prefix}***${lastTwo}`;
    }

    function updateWinnerText(){
      let text = '';
      const emojis = ['✨', '👑', '⭐', '💎', '🎉', '🚀'];
      for(let i=0;i<8;i++){
        const u = generateUsername();
        const p = prizes[Math.floor(Math.random() * prizes.length)];
        const e = emojis[Math.floor(Math.random() * emojis.length)];
        text += `${e} Selamat kepada ${u} mendapatkan ${p.value}! `;
      }
      document.getElementById('winnerText').textContent = text;
    }

    // =============================
    // Sound
    // =============================
    function playSound(type){
      if(!soundEnabled) return;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if(type === 'click'){
        osc.frequency.setValueAtTime(650, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(920, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.10);
        osc.start(); osc.stop(ctx.currentTime + 0.10);
      }

      if(type === 'win'){
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.18, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
            o.start(); o.stop(ctx.currentTime + 0.25);
          }, idx * 130);
        });
      }
    }

    // =============================
    // UI Blocks
    // =============================
    function renderWelcome(){
      return `
        <div class="text-center relative z-10 w-full max-w-2xl">
          <div class="rounded-3xl p-7 md:p-9 border shadow-2xl mb-7"
               style="background: radial-gradient(900px 550px at 35% 20%, rgba(248,211,106,.10), transparent 55%),
                              linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
                      border-color: rgba(255,255,255,.14);
                      backdrop-filter: blur(12px);">
            <div class="text-4xl md:text-6xl font-black tracking-wide">
              <span style="background-image: linear-gradient(180deg, var(--gold1), var(--gold2), var(--gold3)); -webkit-background-clip:text; color:transparent;">AJAIB</span>
              <span class="text-white">4D</span>
            </div>
            <p class="mt-2 text-white/70 text-sm md:text-base">Luxury 3D • Elegant • Premium Experience</p>
          </div>

          <div class="flex justify-center mb-7">
            <div class="mystery-stage">
              <div class="mystery-cube" aria-label="Mystery Box 3D">
                <div class="face front"><span class="mark">?</span></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
              </div>
            </div>
          </div>

          <h1 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text mb-3"
              style="background-image: linear-gradient(180deg, var(--gold1), var(--gold2), var(--gold3));">
            HARTA KARUN
          </h1>

          <div class="rounded-2xl p-6 border shadow-2xl mb-7 max-w-xl mx-auto"
               style="background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
                      border-color: rgba(255,255,255,.12);
                      backdrop-filter: blur(12px);">
            <p class="text-white/90 text-base md:text-lg font-semibold leading-relaxed">
              ⚓ HADIAH SPECIAL ⚓<br/>
              <span class="text-yellow-300">SPIN & MASUKKAN USER ID</span><br/>
              <span class="text-sm text-white/60">Raih hadiah premium dengan tampilan elegan.</span>
            </p>
          </div>

          <button id="showPrizesBtn"
                  class="w-full md:w-auto px-10 py-4 rounded-full font-black border shadow-xl hover:scale-[1.03] transition mb-4"
                  style="background: linear-gradient(135deg, rgba(59,130,246,.95), rgba(37,99,235,.95));
                         border-color: rgba(255,255,255,.20);">
            ☠ LIST HADIAH ☠
          </button>

          <div class="mt-2">
            <button id="startBtn"
                    class="w-full md:w-auto px-12 py-5 rounded-full font-black text-xl md:text-2xl border shadow-2xl hover:scale-105 transition"
                    style="background: linear-gradient(135deg, rgba(248,211,106,.95), rgba(243,185,74,.95));
                           color:#000;
                           border-color: rgba(255,255,255,.35);">
              ╰┈➤ SPIN DISINI ✗
            </button>
          </div>
        </div>
      `;
    }

    function renderInput(){
      return `
        <div class="w-full max-w-md">
          <div class="rounded-3xl p-7 border shadow-2xl"
               style="background: radial-gradient(900px 550px at 35% 20%, rgba(248,211,106,.10), transparent 55%),
                              linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
                      border-color: rgba(255,255,255,.14);
                      backdrop-filter: blur(12px);">
            <div class="text-center mb-6">
              <h2 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text"
                  style="background-image: linear-gradient(180deg, var(--gold1), var(--gold2), var(--gold3));">
                Masukkan User ID
              </h2>
              <p class="text-white/60 text-sm mt-2">Untuk mengklaim hadiah Anda.</p>
            </div>

            <input id="userIdInput"
                   type="text"
                   placeholder="Contoh: vip_***88"
                   class="w-full px-5 py-4 rounded-xl bg-black/40 border border-white/15 text-white placeholder-white/40
                          focus:outline-none focus:border-yellow-400/60" />

            <div id="errorMsg" class="hidden mt-4 rounded-xl border border-red-500/40 bg-red-950/40 text-red-200 px-4 py-3 text-sm"></div>

            <button id="continueBtn"
                    class="w-full mt-5 py-4 rounded-xl font-black border shadow-lg hover:scale-[1.01] transition"
                    style="background: linear-gradient(135deg, rgba(248,211,106,.95), rgba(243,185,74,.95));
                           color:#000;
                           border-color: rgba(255,255,255,.35);">
              ✨ Lanjutkan
            </button>

            <button id="backBtn"
                    class="w-full mt-3 py-3 rounded-xl font-bold border border-white/12 bg-white/5 hover:bg-white/8 transition">
              ⟵ Kembali
            </button>
          </div>
        </div>
      `;
    }

    function renderBoxSelection(){
      let boxes = '';
      for(let i=0;i<9;i++){
        boxes += `
          <button class="box-btn tilt-card aspect-square rounded-2xl border shadow-2xl p-3 flex flex-col items-center justify-center"
                  style="background: radial-gradient(500px 280px at 40% 25%, rgba(248,211,106,.16), transparent 55%),
                                 linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
                         border-color: rgba(255,255,255,.14);
                         backdrop-filter: blur(12px);"
                  data-index="${i}">
            <div class="text-sm md:text-lg font-black tracking-wide">
              <span style="background-image: linear-gradient(180deg, var(--gold1), var(--gold2), var(--gold3)); -webkit-background-clip:text; color:transparent;">AJAIB</span>
              <span class="text-white">4D</span>
            </div>
            <div class="mt-2 text-4xl md:text-5xl">🎁</div>
            <div class="mt-2 text-xs text-white/60">PILIH</div>
          </button>
        `;
      }

      return `
        <div class="text-center w-full max-w-2xl">
          <div class="rounded-2xl p-5 mb-7 border shadow-2xl"
               style="background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
                      border-color: rgba(255,255,255,.12);
                      backdrop-filter: blur(12px);">
            <h2 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text"
                style="background-image: linear-gradient(180deg, var(--gold1), var(--gold2), var(--gold3));">
              ⚔️ PILIH 1 BOX KEBERUNTUNGAN ⚔️
            </h2>
            <p class="text-white/60 text-sm mt-2">Klik satu box untuk melihat hadiah.</p>
          </div>

          <div class="grid grid-cols-3 gap-4 md:gap-6">
            ${boxes}
          </div>
        </div>
      `;
    }

    function renderResult(prize){
      const storedUser = localStorage.getItem("USER_ID") || "Unknown";
      return `
        <div class="w-full max-w-md">
          <div class="relative rounded-3xl p-7 md:p-10 border shadow-2xl text-center"
               style="background: radial-gradient(900px 550px at 35% 20%, rgba(248,211,106,.10), transparent 55%),
                              linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
                      border-color: rgba(255,255,255,.14);
                      backdrop-filter: blur(12px);">

            <div class="absolute top-4 left-4 rounded-xl px-4 py-2 font-black shadow-lg border border-white/20"
                 style="background: linear-gradient(135deg, rgba(34,197,94,.95), rgba(22,163,74,.95));">
              User ID: ${storedUser}
            </div>

            <div class="text-8xl mb-5">${prize.icon}</div>

            <h2 class="text-3xl md:text-4xl font-black text-transparent bg-clip-text mb-2"
                style="background-image: linear-gradient(180deg, var(--gold1), var(--gold2), var(--gold3));">
              SELAMAT! 🎉
            </h2>
            <p class="text-white/70 mb-5">Anda mendapatkan:</p>

            <div class="rounded-2xl py-6 px-6 border shadow-xl mb-6"
                 style="background: linear-gradient(135deg, rgba(248,211,106,.95), rgba(243,185,74,.95));
                        border-color: rgba(255,255,255,.35);
                        color:#000;">
              <p class="text-3xl font-black">${prize.value}</p>
            </div>

            <p class="text-sm text-white/55 mb-6">💬 Klaim hadiah sekarang juga.</p>

            <button id="claimBtn"
                    class="w-full py-4 rounded-xl font-black border shadow-lg hover:scale-[1.01] transition"
                    style="background: linear-gradient(135deg, rgba(248,211,106,.95), rgba(243,185,74,.95));
                           color:#000;
                           border-color: rgba(255,255,255,.35);">
              🎁 Klaim Hadiah Sekarang
            </button>

            <button id="resetBtn"
                    class="w-full mt-3 py-3 rounded-xl font-bold border border-white/12 bg-white/5 hover:bg-white/8 transition">
              🏠 Kembali
            </button>
          </div>
        </div>
      `;
    }

    // =============================
    // Render controller
    // =============================
    function render(){
      const app = document.getElementById('app');

      if(stage === 'welcome'){
        app.innerHTML = renderWelcome();

        document.getElementById('startBtn').onclick = () => {
          playSound('click');
          stage = 'input';
          render();
        };
        document.getElementById('showPrizesBtn').onclick = () => {
          playSound('click');
          showPrizeModal();
        };
      }

      if(stage === 'input'){
        app.innerHTML = renderInput();

        document.getElementById('continueBtn').onclick = () => {
          playSound('click');
          const input = document.getElementById('userIdInput').value.trim();
          const error = document.getElementById('errorMsg');

          if(!input){
            error.textContent = '⚠️ Silahkan masukkan User ID Anda!';
            error.classList.remove('hidden');
            return;
          }
          if(claimedUsers.includes(input.toLowerCase())){
            error.textContent = '⚠️ User ID ini sudah pernah mengklaim hadiah!';
            error.classList.remove('hidden');
            return;
          }

          userId = input;
          localStorage.setItem("USER_ID", userId);

          stage = 'select';
          render();
        };

        document.getElementById('backBtn').onclick = () => {
          playSound('click');
          stage = 'welcome';
          render();
        };
      }

      if(stage === 'select'){
        app.innerHTML = renderBoxSelection();

        document.querySelectorAll('.box-btn').forEach(btn => {
          btn.onclick = function(){
            playSound('click');

            // lock
            document.querySelectorAll('.box-btn').forEach(b => b.disabled = true);

            // premium selection effect
            this.style.transform = "translateY(-6px) rotateX(10deg) rotateY(-10deg) scale(1.06)";
            this.style.boxShadow = "0 30px 90px rgba(0,0,0,.55)";

            setTimeout(() => {
              const realPrizes = [
                { name:'Saldo 100rb', value:'Rp 100.000', icon:'💸' },
                { name:'Saldo 150rb', value:'Rp 150.000', icon:'💸' },
                { name:'Saldo 200rb', value:'Rp 200.000', icon:'💸' },
                { name:'Saldo 500rb', value:'Rp 500.000', icon:'💸' }
              ];

              const prize = realPrizes[Math.floor(Math.random() * realPrizes.length)];
              claimedUsers.push(userId.trim().toLowerCase());

              playSound('win');
              stage = 'result';
              app.innerHTML = renderResult(prize);

              document.getElementById('claimBtn').onclick = () => {
                playSound('click');
                window.open('https://one.ajaibraih.com/', '_blank');
              };
              document.getElementById('resetBtn').onclick = () => {
                playSound('click');
                stage = 'welcome';
                userId = '';
                render();
              };
            }, 1200);
          };
        });
      }
    }

    // =============================
    // Prize modal
    // =============================
    function showPrizeModal(){
      const modal = document.getElementById('prizeModal');
      const prizeList = document.getElementById('prizeList');

      prizeList.innerHTML = prizes.map(p => `
        <div class="rounded-2xl p-6 border shadow-xl tilt-card"
             style="background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
                    border-color: rgba(255,255,255,.14);
                    backdrop-filter: blur(12px);">
          <div class="text-center">
            <div class="text-6xl mb-3">${p.icon}</div>
            <h3 class="text-xl font-black mb-2 text-transparent bg-clip-text"
                style="background-image: linear-gradient(180deg, var(--gold1), var(--gold2), var(--gold3));">
              ${p.name}
            </h3>
            <div class="rounded-lg py-2 px-4 border border-white/10 bg-black/30">
              <p class="text-2xl font-black text-white">${p.value}</p>
            </div>
          </div>
        </div>
      `).join('');

      modal.classList.remove('hidden');
    }

    // =============================
    // Events (global)
    // =============================
    document.getElementById('soundToggle').onclick = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇';
      playSound('click');
    };

    document.getElementById('liveChatBtn').onclick = () => {
      playSound('click');
      window.open(
        'https://static.zdassets.com/web_widget/latest/liveChat.html?v=10#key=hokiajaib4d.zendesk.com',
        '_blank'
      );
    };

    document.getElementById('closePrizeModal').onclick = () => {
      playSound('click');
      document.getElementById('prizeModal').classList.add('hidden');
    };

    // =============================
    // Init
    // =============================
    createSparkles();
    updateWinnerText();
    setInterval(updateWinnerText, 12000);
    render();
  </script>
</body>
</html>
